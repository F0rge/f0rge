# docker-compose.dev.yml
#
# Develop-branch Coolify stack for health-tracker.
#
# Differences from docker-compose.prod.yml:
#  - All container names + volume names prefixed with `dev-` so dev cannot
#    collide with prod on the same Docker daemon.
#  - Host ports shifted into the 81xx / 31xx range (8104 backend, 8107 mcp).
#    Prod uses 8004 / 8007.
#  - No vault bind-mount. VAULT_PATH is set to "" so photo + obsidian writers
#    are no-ops (see backend/app/services/photo_storage.py and obsidian.py:
#    `if vault_path:` already guards every vault write).
#  - No postgres-backup sidecar. Dev DB is disposable.
#  - CORS_ORIGINS scoped to the dev subdomains.
#
# Deployed via Coolify (project "Health Tracker Dev"). Coolify will rename
# containers to <service>-<projectUuid>-<deployId> at deploy time; the
# `container_name:` keys below are advisory only.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: health-tracker-dev-postgres
    environment:
      - POSTGRES_USER=health
      - POSTGRES_DB=health
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=20
    volumes:
      - health-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - health-tracker-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-dev-backend
    user: "1000:1000"
    ports:
      - "8104:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Empty VAULT_PATH disables every vault write path in the backend
      # (photo_storage.py + obsidian.py both guard on `if vault_path:`).
      - VAULT_PATH=
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - CORS_ORIGINS=["https://health-dev.leo-figueiredo.com","https://health-dev-api.leo-figueiredo.com","http://localhost:3104"]
      - PHOTO_DIR=/app/photos
      - PIN_HASH=${PIN_HASH}
    volumes:
      - health-dev-photos:/app/photos
      - health-dev-lab-attachments:/app/lab_attachments
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - health-tracker-dev-network

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-dev-mcp
    user: "1000:1000"
    command: ["uv", "run", "python", "-m", "app.mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8005"]
    # Dev MCP: host:8107 -> container:8005. Prod uses 8007.
    # Cloudflare ingress for health-dev-mcp.leo-figueiredo.com must target localhost:8107.
    ports:
      - "8107:8005"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - MCP_READONLY_DATABASE_URL=postgresql+asyncpg://healthtracker_ro:${HEALTHTRACKER_RO_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8005
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - health-tracker-dev-network

  embedding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-dev-embedding-worker
    user: "1000:1000"
    command: ["uv", "run", "python", "-m", "app.embedding_pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - EMBEDDING_WORKER_POLL_INTERVAL_SECONDS=5
      - EMBEDDING_WORKER_BATCH_SIZE=10
      - EMBEDDING_WORKER_MAX_ATTEMPTS=5
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - health-tracker-dev-network

  # Frontend is managed by a separate Coolify app (resource type: dockerfile)
  # in the same "Health Tracker Dev" project. It owns host port 3104.

volumes:
  health-dev-postgres-data:
  health-dev-photos:
  health-dev-lab-attachments:

networks:
  health-tracker-dev-network:
    driver: bridge
