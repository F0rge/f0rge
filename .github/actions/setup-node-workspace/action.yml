name: Setup Node workspace
description: Node 22 and the root npm workspace install, restored from cache when package-lock.json is unchanged

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    # The installed tree is cached, not npm's download cache: `npm ci` itself is the slow part.
    # .nx/cache is deliberately not persisted between machines.
    - uses: actions/cache@v6
      id: node-modules
      with:
        path: '**/node_modules'
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

    - name: Install root deps
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
