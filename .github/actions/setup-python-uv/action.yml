name: Setup Python uv
description: uv + Python 3.10, optionally install pinned ruff from .github/ruff-version

inputs:
  install-ruff:
    description: Install pinned ruff via uv tool
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Pin Python 3.10
      shell: bash
      run: uv python install 3.10

    - name: Install pinned ruff
      if: inputs.install-ruff == 'true'
      shell: bash
      run: uv tool install "ruff==$(tr -d '[:space:]' < .github/ruff-version)"
