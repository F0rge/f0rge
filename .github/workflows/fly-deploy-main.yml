name: Fly Deploy (main)

# Deploys the Fly prod stack after CI (main) passes on a push to main.
# Each component deploys only when its Nx project is affected since the last
# successful deploy. workflow_dispatch can target all, api, mcp, or frontend.

on:
  workflow_run:
    workflows: ["CI (main)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        type: choice
        options: [all, api, mcp, frontend]
        default: all

concurrency:
  group: fly-deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    uses: ./.github/workflows/fly-deploy-reusable.yml
    with:
      environment: main
      sha: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      base_branch: main
      workflow_id: fly-deploy-main.yml
      component: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'auto' }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
