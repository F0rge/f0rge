name: Firstout continuous deployment

# The privileged path accepts only this repository's successful main CI push.
# PR workflow runs, forks and manual replay cannot select production source.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: firstout-production
  cancel-in-progress: false

jobs:
  tested-images:
    if: >-
      github.repository == 'F0rge/f0rge' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'F0rge/f0rge'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      packages: write
      issues: read
    outputs:
      affected: ${{ steps.gate.outputs.affected }}
      source: ${{ steps.gate.outputs.source }}
    env:
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-python-uv
      - name: Verify trusted source checks and affected Firstout projects
        id: gate
        env:
          BOOTSTRAP_BACKEND_IMAGE: ${{ vars.FIRSTOUT_BOOTSTRAP_BACKEND_IMAGE }}
        run: python3 .github/scripts/firstout-cd.py gate
      - name: Check public build configuration
        if: steps.gate.outputs.affected == 'true'
        env:
          API_URL: ${{ vars.FIRSTOUT_API_URL }}
          CLERK_KEY: ${{ vars.FIRSTOUT_CLERK_PUBLISHABLE_KEY }}
          TENANT_SUBDOMAINS: ${{ vars.FIRSTOUT_TENANT_SUBDOMAINS_ENABLED }}
        run: |
          set -euo pipefail
          test "$API_URL" = 'https://api.firstout.co.za'
          [[ "$CLERK_KEY" == pk_live_* ]]
          [[ "$TENANT_SUBDOMAINS" =~ ^(true|false)$ ]]
      - name: Test Firstout applications
        if: steps.gate.outputs.affected == 'true'
        run: |
          uv sync --frozen --project apps/firstout/backend
          npx nx run-many --projects=firstout-backend,firstout-frontend --targets=lint,typecheck,test --skip-nx-cache --output-style=static
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.affected == 'true'
      - name: Build backend once
        if: steps.gate.outputs.affected == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/firstout/backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: firstout-backend:cd-candidate
          build-args: SOURCE_COMMIT=${{ github.event.workflow_run.head_sha }}
      - name: Build frontend once
        if: steps.gate.outputs.affected == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/firstout/frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: firstout-frontend:cd-candidate
          build-args: |
            SOURCE_COMMIT=${{ github.event.workflow_run.head_sha }}
            API_URL=${{ vars.FIRSTOUT_API_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.FIRSTOUT_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_TENANT_SUBDOMAINS_ENABLED=${{ vars.FIRSTOUT_TENANT_SUBDOMAINS_ENABLED }}
      - name: Test exact images and database compatibility without external services
        if: steps.gate.outputs.affected == 'true'
        env:
          PREVIOUS_BACKEND_IMAGE: ${{ steps.gate.outputs.previous_backend_image }}
        run: |
          node .github/scripts/firstout-container-smoke.mjs firstout-frontend:cd-candidate
          node .github/scripts/firstout-cd-containers.mjs firstout-backend:cd-candidate
      - name: Authenticate publication only
        if: steps.gate.outputs.affected == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested images and create release record
        if: steps.gate.outputs.affected == 'true'
        env:
          PREVIOUS_BACKEND_IMAGE: ${{ steps.gate.outputs.previous_backend_image }}
        run: python3 .github/scripts/firstout-cd.py publish
      - name: Retain release manifest
        if: steps.gate.outputs.affected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firstout-cd-images
          path: firstout-cd.json
          if-no-files-found: error

  deploy:
    needs: tested-images
    if: needs.tested-images.outputs.affected == 'true'
    runs-on: ubuntu-latest
    # Includes both rollout waits, both recovery waits, checks and journal writes.
    timeout-minutes: 80
    environment: firstout-production
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.tested-images.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tested-images.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: firstout-cd-images
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned provider CLI
        run: npm install --global @railway/cli@5.74.0
      - name: Deploy, verify and automatically recover on failure
        env:
          RAILWAY_TOKEN: ${{ secrets.FIRSTOUT_RAILWAY_TOKEN }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo 'Configure FIRSTOUT_RAILWAY_TOKEN in firstout-production before enabling CD.'; exit 1; }
          python3 .github/deploy/firstout_cd.py deploy --manifest firstout-cd.json --state-file firstout-cd-receipt.json
      - name: Retain release or recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firstout-cd-receipt
          path: firstout-cd-receipt.json
          if-no-files-found: warn
