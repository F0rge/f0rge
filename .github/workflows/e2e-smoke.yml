name: E2E smoke

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  playwright:
    name: playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: health
          POSTGRES_PASSWORD: health
          POSTGRES_DB: health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health -d health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://health:health@localhost:5432/health
      JWT_SECRET: e2e-ci-jwt-secret-32-chars-minimum
      SETTINGS_ENCRYPTION_KEY: dGVzdC1rZXktMzJieXRzLWZvci1mZXJuZXQtMTIzNDU2Nzg=
      HEALTHTRACKER_RO_PASSWORD: e2e-ro-pass
      HEALTHTRACKER_APP_PASSWORD: e2e-app-pass
      PHOTO_DIR: photos
      FOOD_ANALYSIS_ENABLED: 'false'
      WEATHER_FETCH_ENABLED: 'false'
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.10
        run: uv python install 3.10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: |
          npm ci
          uv sync --frozen --project apps/marrow/backend
          npx playwright install --with-deps chromium

      - name: Migrate database
        working-directory: apps/marrow/backend
        run: uv run alembic upgrade head

      - name: Start backend
        working-directory: apps/marrow/backend
        run: |
          uv run uvicorn app.main:app --port 8000 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done

      - name: Start frontend
        run: |
          npm run dev -w frontend &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/login && break
            sleep 2
          done

      - name: Run Playwright smoke
        working-directory: apps/marrow/frontend
        run: npx playwright test
