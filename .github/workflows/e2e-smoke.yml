name: E2E smoke

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This suite only exercises marrow backend + frontend; skip it for everything else.
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.affected.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Resolve affected projects
        id: affected
        run: |
          set -o pipefail
          PROJECTS=$(npx nx show projects --affected --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(" ")')
          run=false
          case " $PROJECTS " in
            *" marrow-backend "*|*" marrow-frontend "*) run=true ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "affected: $PROJECTS (e2e: $run)"

  playwright-run:
    name: playwright run
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: health
          POSTGRES_PASSWORD: health
          POSTGRES_DB: health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health -d health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://health:health@localhost:5432/health
      JWT_SECRET: e2e-ci-jwt-secret-32-chars-minimum
      SETTINGS_ENCRYPTION_KEY: dGVzdC1rZXktMzJieXRzLWZvci1mZXJuZXQtMTIzNDU2Nzg=
      HEALTHTRACKER_RO_PASSWORD: e2e-ro-pass
      HEALTHTRACKER_APP_PASSWORD: e2e-app-pass
      PHOTO_DIR: photos
      FOOD_ANALYSIS_ENABLED: 'false'
      WEATHER_FETCH_ENABLED: 'false'
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.10
        run: uv python install 3.10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: |
          npm ci
          uv sync --frozen --project apps/marrow/backend
          npx playwright install --with-deps chromium

      - name: Migrate database
        working-directory: apps/marrow/backend
        run: uv run alembic upgrade head

      - name: Start backend
        working-directory: apps/marrow/backend
        run: |
          uv run uvicorn app.main:app --port 8000 --host 127.0.0.1 &
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Backend failed to become healthy"
            exit 1
          fi

      - name: Start frontend
        run: |
          npm run dev -w frontend &
          ready=false
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/login; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Frontend failed to become healthy"
            exit 1
          fi

      - name: Run Playwright smoke
        working-directory: apps/marrow/frontend
        run: npx playwright test

  # Always-green context for branch rulesets — even when marrow is unaffected.
  playwright-smoke:
    name: playwright smoke
    needs: [detect, playwright-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          RUN_FLAG: ${{ needs.detect.outputs.run }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright-run.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "detect job required but result was: $DETECT_RESULT"
            exit 1
          fi
          if [ "$RUN_FLAG" != "true" ]; then
            echo "E2E not required for this change — gate OK"
            exit 0
          fi
          if [ "$PLAYWRIGHT_RESULT" != "success" ]; then
            echo "playwright run required but result was: $PLAYWRIGHT_RESULT"
            exit 1
          fi
