name: Release gate

# Fail closed. This workflow does not deploy and has no production secrets.
# workflow_dispatch on this file still cannot authorize a rollout.
# pull_request and push do not run it, so a PR cannot execute it with credentials.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Documented target name. Naming it does not authorize a deploy.
        required: true
        type: string
      sha:
        description: Full commit SHA. A branch or tag name is rejected.
        required: true
        type: string
      digest:
        description: sha256 digest of the already tested immutable artifact.
        required: true
        type: string

permissions:
  contents: read

jobs:
  deny:
    name: deny rollout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse without an external approval binding
        working-directory: .github/deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          SHA: ${{ inputs.sha }}
          DIGEST: ${{ inputs.digest }}
          ACTOR: ${{ github.actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_KIND: sha
        run: |
          set -euo pipefail
          python3 -c 'import os, release_gate; raise SystemExit(release_gate.deny_from_env(os.environ))'
