name: CI (nightly)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-matrix:
    name: full nx matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-uv
        with:
          install-ruff: "true"

      - uses: ./.github/actions/setup-node-workspace

      - name: Install Python project deps
        run: |
          for p in $(npx nx show projects --projects tag:platform:py --json | jq -r '.[]'); do
            ROOT=$(npx nx show project "$p" --json | jq -r '.root')
            uv sync --frozen --project "$ROOT"
          done

      - name: Assert no root uv.lock
        run: bash .github/scripts/assert-no-root-uv-lock.sh

      - name: Python lib boundary guard
        run: bash .github/scripts/check-lib-boundary.sh

      - name: npm audit (high+, production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: uv pip audit (marrow backend)
        run: |
          cd apps/marrow/backend
          uv export --frozen --no-dev --no-hashes --no-editable -o /tmp/marrow-req.txt
          python3 -m pip install --user pip-audit
          python3 -m pip_audit -r /tmp/marrow-req.txt

      - name: nx run-many (all platform projects)
        run: |
          npx nx run-many -t lint format-check test --projects tag:platform:py
          npx nx run-many -t lint typecheck test build --projects tag:platform:ts
