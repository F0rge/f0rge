name: Deploy (reusable)

# Manifest-driven orchestrator: routes affected components to Railway smoke or Coolify.

on:
  workflow_call:
    inputs:
      environment:
        description: main (only deployed branch)
        required: true
        type: string
      sha:
        description: Commit SHA to deploy
        required: true
        type: string
      base_branch:
        description: Branch used for nx-set-shas base
        required: true
        type: string
      component:
        description: auto (nx affected + manifest) or all/api/mcp/frontend (manual marrow)
        required: false
        type: string
        default: auto
    secrets:
      COOLIFY_BASE_URL:
        required: false
      COOLIFY_WEBHOOK_DASKASAS_BACKEND:
        required: false
      COOLIFY_WEBHOOK_DASKASAS_FRONTEND:
        required: false
      COOLIFY_WEBHOOK_BUYCYCLE:
        required: false
      COOLIFY_WEBHOOK_ENVMON_BACKEND:
        required: false
      COOLIFY_WEBHOOK_ENVMON_FRONTEND:
        required: false
      SMOKE_EMAIL:
        required: false
      SMOKE_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_api: ${{ steps.plan.outputs.deploy_api }}
      deploy_mcp: ${{ steps.plan.outputs.deploy_mcp }}
      deploy_frontend: ${{ steps.plan.outputs.deploy_frontend }}
      coolify_matrix: ${{ steps.plan.outputs.coolify_matrix }}
      coolify_diff_base: ${{ steps.plan.outputs.coolify_diff_base }}
      api_health_url: ${{ steps.plan.outputs.api_health_url }}
      frontend_health_url: ${{ steps.plan.outputs.frontend_health_url }}
      mcp_health_url: ${{ steps.plan.outputs.mcp_health_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - uses: ./.github/actions/setup-node-workspace

      - uses: nrwl/nx-set-shas@v4
        if: inputs.component == 'auto'
        with:
          main-branch-name: ${{ inputs.base_branch }}
          # Last successful CI run defines the nx-affected base (Deploy follows CI).
          workflow-id: ci.yml

      - name: Parent of the deployed commit (Coolify affected fallback when NX_BASE == NX_HEAD)
        if: inputs.component == 'auto'
        run: echo "NX_PARENT=$(git rev-parse --verify -q '${{ inputs.sha }}^' || true)" >> "$GITHUB_ENV"

      - name: Resolve deploy plan from manifest
        id: plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
          NX_BASE: ${{ env.NX_BASE }}
          NX_HEAD: ${{ env.NX_HEAD }}
          NX_PARENT: ${{ env.NX_PARENT }}
        run: python3 .github/deploy/plan_deploy.py

  smoke-railway:
    name: smoke railway
    needs: plan
    if: >-
      needs.plan.outputs.deploy_api == 'true' ||
      needs.plan.outputs.deploy_mcp == 'true' ||
      needs.plan.outputs.deploy_frontend == 'true'
    uses: ./.github/workflows/railway-smoke-reusable.yml
    with:
      environment: ${{ inputs.environment }}
      smoke_api: ${{ needs.plan.outputs.deploy_api == 'true' }}
      smoke_mcp: ${{ needs.plan.outputs.deploy_mcp == 'true' }}
      smoke_frontend: ${{ needs.plan.outputs.deploy_frontend == 'true' }}
      api_health_url: ${{ needs.plan.outputs.api_health_url }}
      frontend_health_url: ${{ needs.plan.outputs.frontend_health_url }}
      mcp_health_url: ${{ needs.plan.outputs.mcp_health_url }}
    secrets:
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  deploy-coolify:
    name: deploy coolify
    needs: plan
    if: needs.plan.outputs.coolify_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.plan.outputs.coolify_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: coolify-${{ matrix.component.app_uuid }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Parent fallback needs the deployed commit's parent (depth >= 2).
          # Full history so an older nx-set-shas base is present too.
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Trigger Coolify deploy webhook
        id: coolify
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          WEBHOOK_SECRET_DASKASAS_BACKEND: ${{ secrets.COOLIFY_WEBHOOK_DASKASAS_BACKEND }}
          WEBHOOK_SECRET_DASKASAS_FRONTEND: ${{ secrets.COOLIFY_WEBHOOK_DASKASAS_FRONTEND }}
          WEBHOOK_SECRET_BUYCYCLE: ${{ secrets.COOLIFY_WEBHOOK_BUYCYCLE }}
          WEBHOOK_SECRET_ENVMON_BACKEND: ${{ secrets.COOLIFY_WEBHOOK_ENVMON_BACKEND }}
          WEBHOOK_SECRET_ENVMON_FRONTEND: ${{ secrets.COOLIFY_WEBHOOK_ENVMON_FRONTEND }}
          SECRET_ENV: ${{ matrix.component.webhook_secret_env }}
          SHA: ${{ inputs.sha }}
          DIFF_BASE: ${{ needs.plan.outputs.coolify_diff_base }}
          BRANCH: main
          APP_NAME: ${{ matrix.component.name }}
          APP_UUID: ${{ matrix.component.app_uuid }}
        run: |
          set -euo pipefail
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          case "$SECRET_ENV" in
            COOLIFY_WEBHOOK_DASKASAS_BACKEND) WEBHOOK_SECRET="$WEBHOOK_SECRET_DASKASAS_BACKEND" ;;
            COOLIFY_WEBHOOK_DASKASAS_FRONTEND) WEBHOOK_SECRET="$WEBHOOK_SECRET_DASKASAS_FRONTEND" ;;
            COOLIFY_WEBHOOK_BUYCYCLE) WEBHOOK_SECRET="$WEBHOOK_SECRET_BUYCYCLE" ;;
            COOLIFY_WEBHOOK_ENVMON_BACKEND) WEBHOOK_SECRET="$WEBHOOK_SECRET_ENVMON_BACKEND" ;;
            COOLIFY_WEBHOOK_ENVMON_FRONTEND) WEBHOOK_SECRET="$WEBHOOK_SECRET_ENVMON_FRONTEND" ;;
            *) echo "Unknown webhook secret env: $SECRET_ENV"; exit 1 ;;
          esac
          # Secrets missing → Coolify path not configured; skip rather than fail the release.
          if [ -z "${COOLIFY_BASE_URL:-}" ] || [ -z "${WEBHOOK_SECRET:-}" ]; then
            echo "::notice::Skipping Coolify deploy for $APP_NAME — COOLIFY_BASE_URL / webhook secret not configured"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Placeholder UUID → app not created in Coolify yet; skip.
          case "$APP_UUID" in TODO*)
            echo "::notice::Skipping Coolify deploy for $APP_NAME — app_uuid is still a placeholder in manifest.yml"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0 ;;
          esac
          # `commits` is required: Coolify reads commits.*.added before checking the
          # signature, and foreaches the result — omitting the key 500s the endpoint.
          # One entry covers the same base..sha range plan_deploy used, so watch
          # paths see the real changed files instead of [].
          if [ -z "${DIFF_BASE:-}" ]; then
            echo "::error::Coolify diff base is empty; plan_deploy did not emit coolify_diff_base"
            exit 1
          fi
          PAYLOAD=$(python3 .github/deploy/coolify_payload.py --sha "$SHA" --base "$DIFF_BASE" --branch "$BRANCH")
          # Each matrix row signs with that component's secret only. Coolify still
          # checks every app on this repo+branch, so siblings answer
          # "Invalid signature." That does not fail the job; only this app's
          # entry must say "Deployment queued."
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')
          RESPONSE=$(curl -sS --fail-with-body -w '\nHTTP %{http_code}' \
            -X POST "${COOLIFY_BASE_URL%/}/webhooks/source/github/events/manual" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=${SIG}" \
            -d "$PAYLOAD") || {
            echo "::error::Coolify webhook rejected the deploy for $APP_NAME"
            echo "$RESPONSE"
            exit 1
          }
          echo "$RESPONSE"
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')

          # App reports Deployments disabled → not deploying through Coolify right now.
          if echo "$BODY" | jq -e --arg uuid "$APP_UUID" '
            [.. | objects
              | select((.uuid? // .id? // .application_id? // .application_uuid? // "") == $uuid)
              | .message? // ""
            ] | any(test("Deployments disabled"; "i"))
          ' >/dev/null 2>&1; then
            echo "::notice::Skipping Coolify deploy for $APP_NAME — deployments disabled on Coolify"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Coolify answers 200 even when it queues nothing (per-app failures land in the
          # body), so a 2xx is not proof of a deploy — assert this app was actually queued.
          # A queued manual push is status "success" + "Deployment queued." (beta.473);
          # status "queued" counts too. Watch-path ignores stay a hard failure.
          if ! printf '%s' "$BODY" | python3 .github/deploy/coolify_payload.py --require-queued --app-uuid "$APP_UUID"; then
            echo "::error::Coolify accepted the webhook but queued no deploy for $APP_NAME ($APP_UUID)"
            exit 1
          fi
          echo "Triggered Coolify deploy for $APP_NAME"

      - name: Smoke health
        # Internal-only targets (e.g. buycycle on the Pi) have no health_url: runners can't reach them,
        # so the queued-deploy assertion above is the check.
        if: steps.coolify.outputs.skipped != 'true' && matrix.component.health_url != ''
        env:
          HEALTH_URL: ${{ matrix.component.health_url }}
        run: |
          UA='Mozilla/5.0 (compatible; f0rge-deploy-smoke/1.0)'
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Health OK: $HEALTH_URL"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — waiting…"
            sleep 15
          done
          echo "Health check failed: $HEALTH_URL"
          exit 1
