name: Retired production release entry point

# Keep the historical callable path inert. An environment approval on this
# job is not permission to deploy or proof of an artifact's provenance.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-hold:
    name: Release blocked pending artifact promotion
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report release hold
        run: |
          echo 'Production release is disabled: tested immutable artifact promotion and provider verification are not configured.'
          exit 1
