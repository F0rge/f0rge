name: CI (main)

# Runs on PRs targeting `main` — promotion of `develop` → `main`.
# Same nx affected targets as develop, plus prod-shaped frontend build env.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/marrow/frontend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: npm ci --prefix apps/marrow/frontend

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.10
        run: uv python install 3.10

      - name: Install backend deps
        run: uv sync --frozen --project apps/marrow/backend

      - name: Install ruff
        run: uv tool install ruff@latest

      - name: nx affected (prod-shaped frontend build)
        env:
          API_URL: http://backend:8000
          NODE_ENV: production
        run: npx nx affected -t lint format-check typecheck test build
