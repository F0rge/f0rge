name: CI (main)

# PR + push + workflow_dispatch: detect → backend/frontend → ci gate → deploy.
# Manual deploy cannot skip lint/test/build — workflow_dispatch runs CI first.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy (runs CI first)
        type: choice
        options: [all, api, mcp, frontend]
        default: all

permissions:
  contents: read
  actions: read

jobs:
  detect:
    name: detect
    concurrency:
      group: ci-main-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.affected.outputs.backend }}
      frontend: ${{ steps.affected.outputs.frontend }}
      py_projects: ${{ steps.affected.outputs.py_projects }}
      ts_projects: ${{ steps.affected.outputs.ts_projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Resolve affected projects
        id: affected
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PY=$(npx nx show projects --projects tag:platform:py --json | jq -r 'join(",")')
            TS=$(npx nx show projects --projects tag:platform:ts --json | jq -r 'join(",")')
          else
            PY=$(npx nx show projects --affected --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(",")')
            TS=$(npx nx show projects --affected --projects tag:platform:ts --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(",")')
          fi
          backend=false
          frontend=false
          [ -n "$PY" ] && backend=true
          [ -n "$TS" ] && frontend=true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "py_projects=$PY" >> "$GITHUB_OUTPUT"
          echo "ts_projects=$TS" >> "$GITHUB_OUTPUT"
          echo "affected py: $PY"
          echo "affected ts: $TS"

  backend:
    name: backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    concurrency:
      group: ci-main-backend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.10
        run: uv python install 3.10

      - name: Install ruff
        run: uv tool install ruff@latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        env:
          PY_PROJECTS: ${{ needs.detect.outputs.py_projects }}
        run: |
          for p in ${PY_PROJECTS//,/ }; do
            ROOT=$(npx nx show project "$p" --json | jq -r '.root')
            uv sync --frozen --project "$ROOT"
          done

      - name: nx run (backend)
        env:
          PY_PROJECTS: ${{ needs.detect.outputs.py_projects }}
        run: npx nx run-many -t lint format-check test --projects "$PY_PROJECTS"

  frontend:
    name: frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    concurrency:
      group: ci-main-frontend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Boundary guard (libs must not import apps)
        run: |
          ! grep -rn "from ['\"].*apps/" libs/ --include='*.ts' --include='*.tsx'

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.10
        run: uv python install 3.10

      - name: OpenAPI codegen drift check
        run: |
          uv sync --frozen --project apps/marrow/backend
          uv run --project apps/marrow/backend python scripts/export_openapi.py
          npm run codegen:api -w frontend
          git diff --exit-code apps/marrow/backend/openapi.json apps/marrow/frontend/openapi.json apps/marrow/frontend/lib/api/generated/schema.ts

      - name: nx run (frontend, prod-shaped build)
        env:
          API_URL: http://backend:8000
          NODE_ENV: production
          TS_PROJECTS: ${{ needs.detect.outputs.ts_projects }}
        run: npx nx run-many -t lint typecheck test build --projects "$TS_PROJECTS"

  ci:
    name: ci
    needs: [detect, backend, frontend]
    if: always()
    concurrency:
      group: ci-main-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BACKEND_FLAG: ${{ needs.detect.outputs.backend }}
          FRONTEND_FLAG: ${{ needs.detect.outputs.frontend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "detect job required but result was: $DETECT_RESULT"
            exit 1
          fi
          gate() {
            local flag="$1" result="$2" name="$3"
            if [ "$flag" = "true" ] && [ "$result" != "success" ]; then
              echo "$name job required but result was: $result"
              exit 1
            fi
          }
          gate "$BACKEND_FLAG" "$BACKEND_RESULT" "backend"
          gate "$FRONTEND_FLAG" "$FRONTEND_RESULT" "frontend"

  deploy:
    name: deploy
    needs: [ci]
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    concurrency:
      group: fly-deploy-main
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: main
      sha: ${{ github.sha }}
      base_branch: main
      workflow_id: ci-main.yml
      component: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'auto' }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
      COOLIFY_WEBHOOK_DK_BACKEND: ${{ secrets.COOLIFY_WEBHOOK_DK_BACKEND }}
      COOLIFY_WEBHOOK_DK_FRONTEND: ${{ secrets.COOLIFY_WEBHOOK_DK_FRONTEND }}
