name: CI (develop)

# Runs on PRs targeting `develop` and on push to `develop`. Single nx affected job.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-develop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/marrow/frontend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: npm ci --prefix apps/marrow/frontend

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.10
        run: uv python install 3.10

      - name: Install backend deps
        run: uv sync --frozen --project apps/marrow/backend

      - name: Install ruff
        run: uv tool install ruff@latest

      - name: nx affected
        run: npx nx affected -t lint format-check typecheck test build
