name: CI (develop)

# Runs on PRs targeting `develop` and on push to `develop`.
# Parallel backend/frontend jobs gated by nx affected; aggregate `ci` job for branch rules.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-develop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.affected.outputs.backend }}
      frontend: ${{ steps.affected.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Resolve affected projects
        id: affected
        run: |
          PROJECTS=$(npx nx show projects --affected --base="${NX_BASE}" --head="${NX_HEAD}" --sep=" ")
          backend=false
          frontend=false
          [[ " $PROJECTS " == *" marrow-backend "* ]] && backend=true
          [[ " $PROJECTS " == *" marrow-frontend "* ]] && frontend=true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "affected: $PROJECTS"

  backend:
    name: backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.10
        run: uv python install 3.10

      - name: Install backend deps
        run: uv sync --frozen --project apps/marrow/backend

      - name: Install ruff
        run: uv tool install ruff@latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: nx run (backend)
        run: npx nx run-many -t lint format-check test --projects=marrow-backend

  frontend:
    name: frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/marrow/frontend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: npm ci --prefix apps/marrow/frontend

      - name: nx run (frontend)
        run: npx nx run-many -t lint typecheck build --projects=marrow-frontend

  ci:
    name: ci
    needs: [detect, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BACKEND_FLAG: ${{ needs.detect.outputs.backend }}
          FRONTEND_FLAG: ${{ needs.detect.outputs.frontend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "detect job required but result was: $DETECT_RESULT"
            exit 1
          fi
          gate() {
            local flag="$1" result="$2" name="$3"
            if [ "$flag" = "true" ] && [ "$result" != "success" ]; then
              echo "$name job required but result was: $result"
              exit 1
            fi
          }
          gate "$BACKEND_FLAG" "$BACKEND_RESULT" "backend"
          gate "$FRONTEND_FLAG" "$FRONTEND_RESULT" "frontend"
