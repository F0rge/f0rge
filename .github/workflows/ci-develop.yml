name: CI (develop)

# Runs on PRs targeting `develop` and on push to `develop`.
# Parallel backend/frontend jobs gated by nx affected; aggregate `ci` job for branch rules.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-develop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.affected.outputs.backend }}
      frontend: ${{ steps.affected.outputs.frontend }}
      py_projects: ${{ steps.affected.outputs.py_projects }}
      ts_projects: ${{ steps.affected.outputs.ts_projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Resolve affected projects
        id: affected
        # Tag-driven: any project carrying platform:py / platform:ts is covered
        # automatically. nx 22.7 ignores --sep and always emits a JSON array, so
        # parse with jq (join -> comma list, which run-many's --projects accepts;
        # empty affected set -> "" so the boolean flags stay false).
        # pipefail is load-bearing: without it a broken project graph makes nx
        # fail while jq exits 0 on empty stdin -> "" -> both jobs skip -> ci
        # passes vacuously. Detect must die loudly when nx can't compute.
        run: |
          set -o pipefail
          PY=$(npx nx show projects --affected --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(",")')
          TS=$(npx nx show projects --affected --projects tag:platform:ts --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(",")')
          backend=false
          frontend=false
          [ -n "$PY" ] && backend=true
          [ -n "$TS" ] && frontend=true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "py_projects=$PY" >> "$GITHUB_OUTPUT"
          echo "ts_projects=$TS" >> "$GITHUB_OUTPUT"
          echo "affected py: $PY"
          echo "affected ts: $TS"

  backend:
    name: backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.10
        run: uv python install 3.10

      - name: Install ruff
        run: uv tool install ruff@latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        env:
          PY_PROJECTS: ${{ needs.detect.outputs.py_projects }}
        # Per-project sync. NEVER run a bare `uv sync` from repo root: a root
        # uv.lock silently flips @nxlv/python into workspace mode. Always --project.
        run: |
          for p in ${PY_PROJECTS//,/ }; do
            ROOT=$(npx nx show project "$p" --json | jq -r '.root')
            uv sync --frozen --project "$ROOT"
          done

      - name: nx run (backend)
        env:
          PY_PROJECTS: ${{ needs.detect.outputs.py_projects }}
        run: npx nx run-many -t lint format-check test --projects "$PY_PROJECTS"

  frontend:
    name: frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: the root `npm ci` installs every workspace — no
      # per-project install loop needed.
      - name: Install root deps
        run: npm ci

      - name: Boundary guard (libs must not import apps)
        # ponytail: grep guard; @nx/eslint enforce-module-boundaries when app #2 lands
        run: |
          ! grep -rn "from ['\"].*apps/" libs/ --include='*.ts' --include='*.tsx'

      - name: nx run (frontend)
        env:
          TS_PROJECTS: ${{ needs.detect.outputs.ts_projects }}
        run: npx nx run-many -t lint typecheck build --projects "$TS_PROJECTS"

  ci:
    name: ci
    needs: [detect, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BACKEND_FLAG: ${{ needs.detect.outputs.backend }}
          FRONTEND_FLAG: ${{ needs.detect.outputs.frontend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "detect job required but result was: $DETECT_RESULT"
            exit 1
          fi
          gate() {
            local flag="$1" result="$2" name="$3"
            if [ "$flag" = "true" ] && [ "$result" != "success" ]; then
              echo "$name job required but result was: $result"
              exit 1
            fi
          }
          gate "$BACKEND_FLAG" "$BACKEND_RESULT" "backend"
          gate "$FRONTEND_FLAG" "$FRONTEND_RESULT" "frontend"
