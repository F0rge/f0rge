name: CI

# PR + push on main, plus workflow_dispatch: parallel Python/frontend/Rust via
# `nx affected` (no detect job) → `ci` gate. This workflow does not deploy
# or authorize a production release.
# The aggregate gate job MUST stay named `ci` — branch rulesets require that context.
# Tests (pytest / frontend unit / e2e-smoke) run for main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# PR → target branch, push/dispatch → the branch itself.
env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  rust:
    name: rust
    concurrency:
      group: ci-rust-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ env.TARGET_BRANCH }}

      - uses: ./.github/actions/setup-node-workspace

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          RUST_VERSION=$(python3 -c 'import pathlib, re, tomllib; version = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Rust channel must be an exact release"; print(version)')
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
          rustup run "$RUST_VERSION" rustc --version
          rustup run "$RUST_VERSION" cargo --version

      - name: Rust registration and failing-target regression checks
        # Always exercise the uncached fixture suite, even before an app adopts Rust.
        run: npx nx run f0rge-rust-checks:test

      - name: Validate every Rust project before affected selection
        run: node .github/rust/guard.mjs

      - name: Nx affected Rust checks
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            npx nx run-many -t=lint,format-check,test,build --projects=tag:platform:rust
          else
            npx nx affected -t=lint,format-check,test,build --exclude='*,!tag:platform:rust' --base="${NX_BASE}" --head="${NX_HEAD}"
          fi

  python:
    name: python
    concurrency:
      group: ci-python-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ env.TARGET_BRANCH }}

      - uses: ./.github/actions/setup-python-uv
        with:
          install-ruff: "true"

      - uses: ./.github/actions/setup-node-workspace

      - name: Repository agent routing and generated adapter checks
        run: |
          npm run agents:check
          npm run agents:test

      - name: Assert no root uv.lock
        run: bash .github/scripts/assert-no-root-uv-lock.sh

      - name: Release evidence and deploy planner checks
        # Always run this uncached tool target; it also reads deployment workflows.
        run: npx nx run f0rge-release-checks:test

      - name: Nx project registration guard
        run: bash .github/scripts/check-nx-projects.sh

      - name: Python lib boundary guard
        run: bash .github/scripts/check-lib-boundary.sh

      - name: Install affected Python deps
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROJECTS=$(npx nx show projects --projects tag:platform:py --json | jq -r '.[]')
          else
            PROJECTS=$(npx nx show projects --affected --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r '.[]')
          fi
          for p in $PROJECTS; do
            ROOT=$(npx nx show project "$p" --json | jq -r '.root')
            # Nested projects do not inherit a repo-root pin. A project
            # .python-version selects the interpreter (Marrow, Firstout, and
            # dk tag-printer are 3.11). Every other project stays on 3.10.
            if [ -f "$ROOT/.python-version" ]; then
              PY=$(tr -d '[:space:]' < "$ROOT/.python-version")
            else
              PY=3.10
            fi
            UV_PYTHON="$PY" uv sync --frozen --project "$ROOT"
          done

      - name: uv pip audit (high severity)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROJECTS=$(npx nx show projects --projects tag:platform:py --json | jq -r 'join(" ")')
          else
            PROJECTS=$(npx nx show projects --affected --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(" ")')
          fi
          case " $PROJECTS " in
            *" marrow-backend "*) ;;
            *) echo "marrow-backend not affected — skip audit"; exit 0 ;;
          esac
          cd apps/marrow/backend
          uv export --frozen --no-dev --no-hashes --no-editable -o /tmp/marrow-req.txt
          python3 -m pip install --user pip-audit
          python3 -m pip_audit -r /tmp/marrow-req.txt

      # Pytest is expensive (testcontainers). Runs for main.
      # workflow_dispatch uses run-many (full matrix).
      - name: nx affected (python)
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TARGET_BRANCH" = "main" ]; then
              npx nx run-many -t=lint,format-check,test --projects=tag:platform:py
            else
              npx nx run-many -t=lint,format-check --projects=tag:platform:py
            fi
          else
            if [ "$TARGET_BRANCH" = "main" ]; then
              npx nx affected -t=lint,format-check,test --exclude='*,!tag:platform:py' --base="${NX_BASE}" --head="${NX_HEAD}"
            else
              npx nx affected -t=lint,format-check --exclude='*,!tag:platform:py' --base="${NX_BASE}" --head="${NX_HEAD}"
            fi
          fi

  frontend:
    name: frontend
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ env.TARGET_BRANCH }}

      - uses: ./.github/actions/setup-node-workspace

      - uses: ./.github/actions/setup-python-uv

      - name: Verify braces security backport
        run: node scripts/security/check-braces.cjs

      - name: Verify fixed dependencies and Medusa compatibility
        run: node scripts/security/check-ci-dependencies.cjs

      - name: npm audit (high severity, production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Boundary guard (libs must not import apps)
        run: |
          ! grep -rn "from ['\"].*apps/" libs/ --include='*.ts' --include='*.tsx'

      - name: Nx project registration guard
        run: bash .github/scripts/check-nx-projects.sh

      - name: Commerce image retention checks
        run: node --test apps/storefront/commerce/scripts/check-container.test.mjs

      # main only: prod-shaped build.
      - name: Prod-shaped build env
        if: env.TARGET_BRANCH == 'main'
        run: |
          echo "API_URL=http://backend:8000" >> "$GITHUB_ENV"
          echo "NODE_ENV=production" >> "$GITHUB_ENV"

      # Install marrow-backend when OpenAPI codegen:check is in the affected set
      # (frontend depends on marrow-backend via implicitDependencies).
      - name: Install marrow-backend for OpenAPI (if affected)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NEED=true
          else
            PROJECTS=$(npx nx show projects --affected --projects tag:platform:ts --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(" ")')
            case " $PROJECTS " in
              *" marrow-frontend "*) NEED=true ;;
              *) NEED=false ;;
            esac
          fi
          if [ "$NEED" = "true" ]; then
            UV_PYTHON=3.11 uv sync --frozen --project apps/marrow/backend
          else
            echo "marrow-frontend not affected — skip backend sync for codegen"
          fi

      # Unit tests run for main alongside lint/typecheck/build + codegen:check.
      # Container tests build local images and run offline probes; they never publish or deploy.
      - name: nx affected (frontend)
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
          F0RGE_COMMERCE_IMAGE_ARCHIVE: ${{ runner.temp }}/f0rge-commerce-image.tar
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TARGET_BRANCH" = "main" ]; then
              npx nx run-many -t=lint,typecheck,test,build,codegen:check,storybook-build,container-test --projects=tag:platform:ts
            else
              npx nx run-many -t=lint,typecheck,build,codegen:check,storybook-build,container-test --projects=tag:platform:ts
            fi
          else
            if [ "$TARGET_BRANCH" = "main" ]; then
              npx nx affected -t=lint,typecheck,test,build,codegen:check,storybook-build,container-test --exclude='*,!tag:platform:ts' --base="${NX_BASE}" --head="${NX_HEAD}"
            else
              npx nx affected -t=lint,typecheck,build,codegen:check,storybook-build,container-test --exclude='*,!tag:platform:ts' --base="${NX_BASE}" --head="${NX_HEAD}"
            fi
          fi

      - name: Check retained commerce image
        id: commerce-image
        env:
          ARCHIVE: ${{ runner.temp }}/f0rge-commerce-image.tar
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            EXPECTED=true
          else
            EXPECTED=$(npx nx show projects --affected --projects=daskasas-commerce --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -er 'if type == "array" and all(.[]; type == "string") then (index("daskasas-commerce") != null) | tostring else error("Invalid Nx project list") end')
          fi
          if [ "$EXPECTED" = true ]; then
            test -s "$ARCHIVE"
            test -s "$ARCHIVE.json"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            test ! -e "$ARCHIVE"
            test ! -e "$ARCHIVE.json"
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      # This unpromoted archive is not a registry manifest, attestation, or release approval.
      # PR archives use the synthetic merge commit and must not be promoted as main artifacts.
      - name: Retain tested commerce image
        if: steps.commerce-image.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-daskasas-commerce-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/f0rge-commerce-image.tar
            ${{ runner.temp }}/f0rge-commerce-image.tar.json
          if-no-files-found: error

  ci:
    name: ci
    needs: [python, frontend, rust]
    if: always()
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          if [ "$PYTHON_RESULT" != "success" ]; then
            echo "python job required but result was: $PYTHON_RESULT"
            exit 1
          fi
          if [ "$FRONTEND_RESULT" != "success" ]; then
            echo "frontend job required but result was: $FRONTEND_RESULT"
            exit 1
          fi
          if [ "$RUST_RESULT" != "success" ]; then
            echo "rust job required but result was: $RUST_RESULT"
            exit 1
          fi
