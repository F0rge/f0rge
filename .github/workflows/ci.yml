name: CI

# PR + push + workflow_dispatch on develop/main: parallel backend/frontend via
# `nx affected` (no detect job) → `ci` gate. Deploy is a separate workflow
# (deploy.yml) after this succeeds on push.
# The aggregate gate job MUST stay named `ci` — branch rulesets require that context.
# Tests (pytest / frontend unit / e2e-smoke) run on main only; develop skips them.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# PR → target branch, push/dispatch → the branch itself.
env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  backend:
    name: backend
    concurrency:
      group: ci-backend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ env.TARGET_BRANCH }}

      - uses: ./.github/actions/setup-python-uv
        with:
          install-ruff: "true"

      - uses: ./.github/actions/setup-node-workspace

      - name: Assert no root uv.lock
        run: bash .github/scripts/assert-no-root-uv-lock.sh

      - name: Nx project registration guard
        run: bash .github/scripts/check-nx-projects.sh

      - name: Python lib boundary guard
        run: bash .github/scripts/check-lib-boundary.sh

      - name: Install affected Python deps
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROJECTS=$(npx nx show projects --projects tag:platform:py --json | jq -r '.[]')
          else
            PROJECTS=$(npx nx show projects --affected --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r '.[]')
          fi
          for p in $PROJECTS; do
            ROOT=$(npx nx show project "$p" --json | jq -r '.root')
            uv sync --frozen --project "$ROOT"
          done

      - name: uv pip audit (high severity)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROJECTS=$(npx nx show projects --projects tag:platform:py --json | jq -r 'join(" ")')
          else
            PROJECTS=$(npx nx show projects --affected --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(" ")')
          fi
          case " $PROJECTS " in
            *" marrow-backend "*) ;;
            *) echo "marrow-backend not affected — skip audit"; exit 0 ;;
          esac
          cd apps/marrow/backend
          uv export --frozen --no-dev --no-hashes --no-editable -o /tmp/marrow-req.txt
          python3 -m pip install --user pip-audit
          python3 -m pip_audit -r /tmp/marrow-req.txt

      # Pytest is expensive (testcontainers). Run it on main/prod only;
      # develop keeps lint + format-check so PRs stay cheap.
      # workflow_dispatch uses run-many (full matrix).
      - name: nx affected (backend)
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TARGET_BRANCH" = "main" ]; then
              npx nx run-many -t lint format-check test --projects tag:platform:py
            else
              npx nx run-many -t lint format-check --projects tag:platform:py
            fi
          else
            if [ "$TARGET_BRANCH" = "main" ]; then
              npx nx affected -t lint format-check test --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}"
            else
              npx nx affected -t lint format-check --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}"
            fi
          fi

  frontend:
    name: frontend
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ env.TARGET_BRANCH }}

      - uses: ./.github/actions/setup-node-workspace

      - uses: ./.github/actions/setup-python-uv

      - name: npm audit (high severity, production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Boundary guard (libs must not import apps)
        run: |
          ! grep -rn "from ['\"].*apps/" libs/ --include='*.ts' --include='*.tsx'

      - name: Nx project registration guard
        run: bash .github/scripts/check-nx-projects.sh

      # main only: prod-shaped build (was the sole difference between ci-main and ci-develop).
      - name: Prod-shaped build env
        if: env.TARGET_BRANCH == 'main'
        run: |
          echo "API_URL=http://backend:8000" >> "$GITHUB_ENV"
          echo "NODE_ENV=production" >> "$GITHUB_ENV"

      # Install marrow-backend when OpenAPI codegen:check is in the affected set
      # (frontend depends on marrow-backend via implicitDependencies).
      - name: Install marrow-backend for OpenAPI (if affected)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NEED=true
          else
            PROJECTS=$(npx nx show projects --affected --projects tag:platform:ts --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(" ")')
            case " $PROJECTS " in
              *" marrow-frontend "*) NEED=true ;;
              *) NEED=false ;;
            esac
          fi
          if [ "$NEED" = "true" ]; then
            uv sync --frozen --project apps/marrow/backend
          else
            echo "marrow-frontend not affected — skip backend sync for codegen"
          fi

      # Unit tests only on main/prod; develop keeps lint/typecheck/build + codegen:check.
      - name: nx affected (frontend)
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TARGET_BRANCH" = "main" ]; then
              npx nx run-many -t lint typecheck test build codegen:check --projects tag:platform:ts
            else
              npx nx run-many -t lint typecheck build codegen:check --projects tag:platform:ts
            fi
          else
            if [ "$TARGET_BRANCH" = "main" ]; then
              npx nx affected -t lint typecheck test build codegen:check --projects tag:platform:ts --base="${NX_BASE}" --head="${NX_HEAD}"
            else
              npx nx affected -t lint typecheck build codegen:check --projects tag:platform:ts --base="${NX_BASE}" --head="${NX_HEAD}"
            fi
          fi

  ci:
    name: ci
    needs: [backend, frontend]
    if: always()
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "backend job required but result was: $BACKEND_RESULT"
            exit 1
          fi
          if [ "$FRONTEND_RESULT" != "success" ]; then
            echo "frontend job required but result was: $FRONTEND_RESULT"
            exit 1
          fi
