name: CI

# PR + push + workflow_dispatch on develop/main: detect → backend/frontend → ci gate.
# Deploy is a separate workflow (deploy.yml) that runs after this succeeds on push.
# The aggregate gate job MUST stay named `ci` — branch rulesets require that context.
# Tests (pytest / frontend unit / e2e-smoke) run on main only; develop skips them.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# PR → target branch, push/dispatch → the branch itself.
env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  detect:
    name: detect
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.affected.outputs.backend }}
      frontend: ${{ steps.affected.outputs.frontend }}
      py_projects: ${{ steps.affected.outputs.py_projects }}
      ts_projects: ${{ steps.affected.outputs.ts_projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ env.TARGET_BRANCH }}

      - uses: ./.github/actions/setup-node-workspace

      - name: Resolve affected projects
        id: affected
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PY=$(npx nx show projects --projects tag:platform:py --json | jq -r 'join(",")')
            TS=$(npx nx show projects --projects tag:platform:ts --json | jq -r 'join(",")')
          else
            PY=$(npx nx show projects --affected --projects tag:platform:py --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(",")')
            TS=$(npx nx show projects --affected --projects tag:platform:ts --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(",")')
          fi
          backend=false
          frontend=false
          [ -n "$PY" ] && backend=true
          [ -n "$TS" ] && frontend=true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "py_projects=$PY" >> "$GITHUB_OUTPUT"
          echo "ts_projects=$TS" >> "$GITHUB_OUTPUT"
          echo "affected py: $PY"
          echo "affected ts: $TS"

  backend:
    name: backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    concurrency:
      group: ci-backend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-uv
        with:
          install-ruff: "true"

      - uses: ./.github/actions/setup-node-workspace

      - name: Install backend deps
        env:
          PY_PROJECTS: ${{ needs.detect.outputs.py_projects }}
        run: |
          for p in ${PY_PROJECTS//,/ }; do
            ROOT=$(npx nx show project "$p" --json | jq -r '.root')
            uv sync --frozen --project "$ROOT"
          done

      - name: Assert no root uv.lock
        run: bash .github/scripts/assert-no-root-uv-lock.sh

      - name: Python lib boundary guard
        run: bash .github/scripts/check-lib-boundary.sh

      - name: uv pip audit (high severity)
        if: contains(needs.detect.outputs.py_projects, 'marrow-backend')
        run: |
          cd apps/marrow/backend
          uv export --frozen --no-dev --no-hashes --no-editable -o /tmp/marrow-req.txt
          python3 -m pip install --user pip-audit
          python3 -m pip_audit -r /tmp/marrow-req.txt

      - name: OpenAPI codegen drift check
        if: contains(needs.detect.outputs.py_projects, 'marrow-backend')
        run: |
          uv sync --frozen --project apps/marrow/backend
          uv run --project apps/marrow/backend python apps/marrow/backend/scripts/export_openapi.py
          npm run codegen:api -w frontend
          git diff --exit-code apps/marrow/backend/openapi.json apps/marrow/frontend/openapi.json apps/marrow/frontend/lib/api/generated/schema.ts

      # Pytest is expensive (testcontainers). Run it on main/prod only;
      # develop keeps lint + format-check so PRs stay cheap.
      - name: nx run (backend)
        env:
          PY_PROJECTS: ${{ needs.detect.outputs.py_projects }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then
            npx nx run-many -t lint format-check test --projects "$PY_PROJECTS"
          else
            npx nx run-many -t lint format-check --projects "$PY_PROJECTS"
          fi

  frontend:
    name: frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-workspace

      - name: npm audit (high severity, production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Boundary guard (libs must not import apps)
        run: |
          ! grep -rn "from ['\"].*apps/" libs/ --include='*.ts' --include='*.tsx'

      - uses: ./.github/actions/setup-python-uv

      # main only: prod-shaped build (was the sole difference between ci-main and ci-develop).
      - name: Prod-shaped build env
        if: env.TARGET_BRANCH == 'main'
        run: |
          echo "API_URL=http://backend:8000" >> "$GITHUB_ENV"
          echo "NODE_ENV=production" >> "$GITHUB_ENV"

      # Unit tests only on main/prod; develop keeps lint/typecheck/build.
      - name: nx run (frontend)
        env:
          TS_PROJECTS: ${{ needs.detect.outputs.ts_projects }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then
            npx nx run-many -t lint typecheck test build --projects "$TS_PROJECTS"
          else
            npx nx run-many -t lint typecheck build --projects "$TS_PROJECTS"
          fi

  ci:
    name: ci
    needs: [detect, backend, frontend]
    if: always()
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BACKEND_FLAG: ${{ needs.detect.outputs.backend }}
          FRONTEND_FLAG: ${{ needs.detect.outputs.frontend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "detect job required but result was: $DETECT_RESULT"
            exit 1
          fi
          gate() {
            local flag="$1" result="$2" name="$3"
            if [ "$flag" = "true" ] && [ "$result" != "success" ]; then
              echo "$name job required but result was: $result"
              exit 1
            fi
          }
          gate "$BACKEND_FLAG" "$BACKEND_RESULT" "backend"
          gate "$FRONTEND_FLAG" "$FRONTEND_RESULT" "frontend"
