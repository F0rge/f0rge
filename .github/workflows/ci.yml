name: CI

# Runs on every pull request and every push to main. Read it top to bottom:
#
#   plan        asks Nx what the change affects, and runs the cheap repository guards
#   python      )
#   typescript  )  one `nx affected` line each; skipped when no Project of that language is affected
#   rust        )
#   image       pull requests: once per affected App, after the language jobs pass, build every
#               deployable Project's image for the App's Host, start it and expect its health
#               endpoint to answer. Read-only: it cannot push.
#   image-push  main only: the same build and check, then push to GHCR. The only job that can
#               write packages, so a pull request can never overwrite an image a release pulls.
#   merge-gate  the single required check (the branch ruleset requires this exact name). When it
#               passes it records the tested tree, so main does not test the same tree twice.
#   cd          main only, after `merge-gate`: release the affected Apps with the images just pushed (cd.yml)
#
# On main, "affected" is measured from the last fully successful run, release included.
# An App whose release failed is therefore built and released again by the next push.
# On main the language jobs are skipped when every commit since then has a tree that already
# passed merge-gate (usually in its pull request); the images are still built.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # nrwl/nx-set-shas looks up the last successful run

# A newer push to a pull request cancels its older run. A run on main is never
# cancelled once it has started: later pushes wait, so releases land in merge order.
# GitHub keeps only the newest waiting run; it covers the ones it replaced, because
# "affected" is measured from the last successful run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
      py: ${{ steps.plan.outputs.py }}
      ts: ${{ steps.plan.outputs.ts }}
      rust: ${{ steps.plan.outputs.rust }}
      apps: ${{ steps.plan.outputs.apps }} # [{ app, host, projects }] for the affected Apps
      tree: ${{ steps.plan.outputs.tree }} # the tree merge-gate marks as tested
      tested: ${{ steps.plan.outputs.tested }} # push only: every commit's tree already passed merge-gate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nrwl/nx-set-shas@v5
        id: shas
      - uses: ./.github/actions/setup-node-workspace
      - name: Repository guards
        run: |
          npm run agents:check
          npm run agents:test
          bash .github/scripts/check-nx-projects.sh
          bash .github/scripts/check-lib-boundary.sh
          test ! -f uv.lock # a root uv.lock flips @nxlv/python into workspace mode
          node scripts/security/check-ci-dependencies.cjs
          npm audit --omit=dev --audit-level=high
      - name: Plan
        id: plan
        shell: bash # pipefail: a failing plan must not be hidden by tee
        env:
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }} # looks up tested-tree markers on main
        run: node .github/scripts/plan.mjs | tee -a "$GITHUB_OUTPUT"

  python:
    needs: plan
    if: needs.plan.outputs.py == 'true' && needs.plan.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_BASE: ${{ needs.plan.outputs.base }}
      NX_HEAD: ${{ needs.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-python-uv
      - run: npx nx affected -t lint,format-check,test,audit --exclude='*,!tag:platform:py'

  typescript:
    needs: plan
    if: needs.plan.outputs.ts == 'true' && needs.plan.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_BASE: ${{ needs.plan.outputs.base }}
      NX_HEAD: ${{ needs.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-python-uv # marrow- and firstout-frontend:codegen:check export their backend's OpenAPI
      - run: npx nx affected -t lint,typecheck,test,build,codegen:check,storybook-build,container-test --exclude='*,!tag:platform:ts'
        env: # production-shaped Next builds
          API_URL: http://backend:8000
          NODE_ENV: production

  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true' && needs.plan.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_BASE: ${{ needs.plan.outputs.base }}
      NX_HEAD: ${{ needs.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - run: node .github/rust/guard.mjs # every Cargo project is registered before Nx selects any
      - run: npx nx affected -t lint,format-check,test,build --exclude='*,!tag:platform:rust'

  image:
    name: image (${{ matrix.app }})
    # Only after the tests: a language job that ran must have passed. One that was skipped
    # (its language not affected, or its tree already tested) does not block; hence the status
    # check is written out.
    needs: [plan, python, typescript, rust]
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.apps != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: ${{ matrix.host == 'pi' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }} # the Pi is ARM64
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      # Every deployable Project of the App, so all of its images come from this one commit.
      - run: npx nx run-many -t image --projects="$PROJECTS"
        env:
          PROJECTS: ${{ matrix.projects }}

  # Same as `image`, on main, plus the push. Kept as a separate job so packages: write never
  # reaches a pull request.
  image-push:
    name: image-push (${{ matrix.app }})
    needs: [plan, python, typescript, rust]
    if: ${{ github.event_name == 'push' && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.apps != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: ${{ matrix.host == 'pi' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx nx run-many -t image --projects="$PROJECTS"
        env:
          PROJECTS: ${{ matrix.projects }}
          IMAGE_PUSH: 'true'

  merge-gate:
    needs: [plan, python, typescript, rust, image, image-push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job is one the plan did not need. Anything failed or cancelled fails the gate.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # Passed: mark this tree as tested, so main can skip the language jobs for it. An explicit
      # if replaces the implicit success(), so both steps state it.
      # Ceiling: when main does run the tests over several commits, only the head tree is marked.
      - if: ${{ success() && !cancelled() }}
        run: echo "$GITHUB_SHA" > tested
      - if: ${{ success() && !cancelled() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true # an artifact outage only costs a re-test on main
        with:
          name: tested-${{ needs.plan.outputs.tree }}
          path: tested
          overwrite: true # a re-run of the same run

  cd:
    needs: [plan, merge-gate]
    # Stated in full: the default "everything before succeeded" would skip this whenever a language job was skipped.
    if: ${{ !cancelled() && needs.merge-gate.result == 'success' && github.event_name == 'push' && needs.plan.outputs.apps != '[]' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd.yml
    with:
      apps: ${{ needs.plan.outputs.apps }}
      commit: ${{ github.sha }}
    # Without this a called workflow sees none of its environments' secrets, so every Release
    # failed with "RAILWAY_TOKEN not set". Each release job reads only its own App's environment.
    secrets: inherit
