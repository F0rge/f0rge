name: Deploy

# Runs after CI succeeds on push/dispatch to develop or main.
# Manual redeploy via workflow_dispatch (does not re-run lint/test — use CI for that).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [develop, main]
        default: develop
      component:
        description: Component to deploy
        type: choice
        options: [all, api, mcp, frontend]
        default: all
      sha:
        description: Commit SHA (empty = branch tip)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: guard
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) &&
        contains(fromJSON('["develop","main"]'), github.event.workflow_run.head_branch)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.out.outputs.environment }}
      sha: ${{ steps.out.outputs.sha }}
      base_branch: ${{ steps.out.outputs.base_branch }}
      component: ${{ steps.out.outputs.component }}
    steps:
      - name: Resolve deploy target
        id: out
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            SHA="${{ inputs.sha }}"
            COMPONENT="${{ inputs.component }}"
            # Empty SHA → tip of the ref this workflow was dispatched against.
            if [ -z "$SHA" ]; then
              SHA="${{ github.sha }}"
            fi
          else
            ENV="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            COMPONENT="auto"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_branch=$ENV" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "Deploy $COMPONENT @ $SHA → $ENV"

  deploy:
    name: deploy
    needs: guard
    concurrency:
      group: deploy-${{ needs.guard.outputs.environment }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: ${{ needs.guard.outputs.environment }}
      sha: ${{ needs.guard.outputs.sha }}
      base_branch: ${{ needs.guard.outputs.base_branch }}
      component: ${{ needs.guard.outputs.component }}
    secrets:
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
      COOLIFY_WEBHOOK_DK_BACKEND: ${{ secrets.COOLIFY_WEBHOOK_DK_BACKEND }}
      COOLIFY_WEBHOOK_DK_FRONTEND: ${{ secrets.COOLIFY_WEBHOOK_DK_FRONTEND }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
