name: Deploy

# Fail closed. A successful CI run, a merge, or a manual dispatch does not
# authorize a rollout. This file does not call the reusable deploy workflow
# and does not receive production secrets. See .github/deploy/RELEASE-GATE.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [main]
        default: main
      component:
        description: Component to deploy
        type: choice
        options: [all, api, mcp, frontend]
        default: all
      sha:
        description: Commit SHA (empty = branch tip)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: guard
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) &&
        contains(fromJSON('["main"]'), github.event.workflow_run.head_branch)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.out.outputs.environment }}
      sha: ${{ steps.out.outputs.sha }}
      base_branch: ${{ steps.out.outputs.base_branch }}
      component: ${{ steps.out.outputs.component }}
    steps:
      - name: Resolve deploy target
        id: out
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_COMPONENT: ${{ inputs.component }}
          REF_SHA: ${{ github.sha }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENV="$INPUT_ENVIRONMENT"
            SHA="$INPUT_SHA"
            COMPONENT="$INPUT_COMPONENT"
            # Empty SHA → tip of the ref this workflow was dispatched against.
            if [ -z "$SHA" ]; then
              SHA="$REF_SHA"
            fi
          else
            ENV="$UPSTREAM_BRANCH"
            SHA="$UPSTREAM_SHA"
            COMPONENT="auto"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_branch=$ENV" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "Refusing rollout of $COMPONENT @ $SHA. Event is not approval."

  deny-rollout:
    name: deny rollout
    needs: guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail closed before any host webhook
        working-directory: .github/deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ needs.guard.outputs.sha }}
          TARGET: ${{ needs.guard.outputs.component }}
          ACTOR: ${{ github.actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: |
          set -euo pipefail
          python3 -c 'import os, release_gate; raise SystemExit(release_gate.deny_from_env(os.environ))'
