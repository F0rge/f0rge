name: Release preparation (no deployment)

# A protected environment is not an artifact-promotion system. This manual
# preparation never deploys, even after approval. Provider and historical
# workflow routes must be audited separately before enabling a release path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preparation:
    name: Release preparation only
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report preparation scope
        run: |
          echo 'Preparation only: no production deployment was performed.'
          echo 'Tested immutable artifact promotion and provider verification are not configured.'
