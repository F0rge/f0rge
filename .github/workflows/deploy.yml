name: Deploy

# Fail closed. A successful CI run, a merge, or a manual dispatch does not
# authorize a rollout. This file does not call the reusable deploy workflow
# and does not receive production secrets. See .github/deploy/RELEASE-GATE.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [main]
        default: main
      component:
        description: Component to deploy
        type: choice
        options: [all, api, mcp, frontend]
        default: all
      sha:
        description: Commit SHA (empty = branch tip)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: guard
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) &&
        contains(fromJSON('["main"]'), github.event.workflow_run.head_branch)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.out.outputs.environment }}
      sha: ${{ steps.out.outputs.sha }}
      base_branch: ${{ steps.out.outputs.base_branch }}
      component: ${{ steps.out.outputs.component }}
    steps:
      - name: Resolve deploy target
        id: out
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            SHA="${{ inputs.sha }}"
            COMPONENT="${{ inputs.component }}"
            # Empty SHA → tip of the ref this workflow was dispatched against.
            if [ -z "$SHA" ]; then
              SHA="${{ github.sha }}"
            fi
          else
            ENV="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            COMPONENT="auto"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_branch=$ENV" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "Refusing rollout of $COMPONENT @ $SHA. Event is not approval."

  deny-rollout:
    name: deny rollout
    needs: guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail closed before any host webhook
        working-directory: .github/deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ needs.guard.outputs.sha }}
          TARGET: ${{ needs.guard.outputs.component }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os,release_gate; evidence={"event_name":os.environ["EVENT_NAME"],"sha":os.environ["SHA"],"target":os.environ["TARGET"],"ci_event":os.environ["EVENT_NAME"],"ci_conclusion":"success","actor":""}; print(json.dumps(release_gate.decide(evidence))); raise SystemExit(1)'
