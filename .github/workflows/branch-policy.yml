name: Branch policy

# Enforces merge hygiene on a private Free repo (native branch protection needs Pro).
#
# - main: reject pushes that are not from a merged pull request
# - develop: PRs must have all review threads resolved and no CHANGES_REQUESTED reviews
#
# When you upgrade to GitHub Pro, mirror these in branch protection settings and keep
# this workflow as a required status check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

concurrency:
  group: branch-policy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  block-direct-push-to-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: main — no direct push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require merged pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const prs = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sha },
            );
            const merged = prs.filter((pr) => pr.merged_at);
            if (merged.length === 0) {
              core.setFailed(
                [
                  "Direct pushes to main are not allowed.",
                  "Open a pull request (develop → main) and merge it instead.",
                  "Native branch protection needs GitHub Pro on private repos;",
                  "this workflow flags violations until Pro rules are enabled.",
                ].join(" "),
              );
              return;
            }
            core.info(
              `Allowed: commit belongs to merged PR(s) ${merged.map((pr) => "#" + pr.number).join(", ")}`,
            );

  pr-merge-gates:
    if: |
      github.event_name != 'push' &&
      github.event.pull_request.draft == false &&
      contains(fromJSON('["develop","main"]'), github.event.pull_request.base.ref)
    name: PR — conversations resolved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check unresolved review threads and change requests
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const base = context.payload.pull_request.base.ref;

            const threadsQuery = `
              query ($owner: String!, $repo: String!, $number: Int!, $after: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes { isResolved path line comments(first: 1) { nodes { author { login } } } }
                    }
                  }
                }
              }
            `;
            const threads = [];
            let after = null;
            while (true) {
              const { repository } = await github.graphql(threadsQuery, {
                owner,
                name: repo,
                number: pull_number,
                after,
              });
              const { nodes, pageInfo } = repository.pullRequest.reviewThreads;
              threads.push(...nodes);
              if (!pageInfo.hasNextPage) break;
              after = pageInfo.endCursor;
            }
            const unresolved = threads.filter((t) => !t.isResolved);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const latestByUser = new Map();
            for (const review of reviews) {
              if (!review.user || review.state === "COMMENTED") continue;
              latestByUser.set(review.user.login, review);
            }
            const changesRequested = [...latestByUser.values()].filter(
              (r) => r.state === "CHANGES_REQUESTED",
            );

            if (unresolved.length > 0) {
              const lines = unresolved.slice(0, 10).map((t) => {
                const who = t.comments.nodes[0]?.author?.login ?? "?";
                return `  - ${t.path}:${t.line} (started by ${who})`;
              });
              core.setFailed(
                [
                  `PR to ${base} has ${unresolved.length} unresolved review thread(s).`,
                  "Resolve all conversations in the PR Files changed tab before merging.",
                  ...lines,
                ].join("\n"),
              );
            }

            if (changesRequested.length > 0) {
              const names = changesRequested.map((r) => r.user.login).join(", ");
              core.setFailed(
                `PR to ${base} has CHANGES_REQUESTED from: ${names}. Address feedback or dismiss the review.`,
              );
            }

            if (unresolved.length === 0 && changesRequested.length === 0) {
              core.info(`PR #${pull_number} → ${base}: all review threads resolved, no change requests.`);
            }
