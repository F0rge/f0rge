name: Fly Deploy

# After a green CI push to develop/main, deploy affected Fly components.
# plan → deploy-api → deploy-mcp (serial); deploy-frontend parallel with MCP.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [develop, main]
        default: develop
      component:
        description: Component to deploy
        type: choice
        options: [all, api, mcp, frontend]
        default: all

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.meta.outputs.should_run }}
      environment: ${{ steps.meta.outputs.environment }}
      sha: ${{ steps.meta.outputs.sha }}
      base_branch: ${{ steps.meta.outputs.base_branch }}
      component: ${{ steps.meta.outputs.component }}
    steps:
      - name: Resolve deploy context
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENV: ${{ inputs.environment }}
          DISPATCH_COMPONENT: ${{ inputs.component }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "environment=$DISPATCH_ENV" >> "$GITHUB_OUTPUT"
            echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "base_branch=$DISPATCH_ENV" >> "$GITHUB_OUTPUT"
            echo "component=$DISPATCH_COMPONENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$RUN_CONCLUSION" != "success" ] || [ "$RUN_EVENT" != "push" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$RUN_BRANCH" != "develop" ] && [ "$RUN_BRANCH" != "main" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "environment=$RUN_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "base_branch=$RUN_BRANCH" >> "$GITHUB_OUTPUT"
          echo "component=auto" >> "$GITHUB_OUTPUT"

  plan:
    name: plan
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_api: ${{ steps.flags.outputs.deploy_api }}
      deploy_mcp: ${{ steps.flags.outputs.deploy_mcp }}
      deploy_frontend: ${{ steps.flags.outputs.deploy_frontend }}
      api_health_url: ${{ steps.urls.outputs.api_health_url }}
      frontend_health_url: ${{ steps.urls.outputs.frontend_health_url }}
      mcp_health_url: ${{ steps.urls.outputs.mcp_health_url }}
    env:
      DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
      BASE_BRANCH: ${{ needs.resolve.outputs.base_branch }}
      COMPONENT: ${{ needs.resolve.outputs.component }}
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci

      - uses: nrwl/nx-set-shas@v4
        if: env.COMPONENT == 'auto'
        with:
          main-branch-name: ${{ needs.resolve.outputs.base_branch }}
          workflow-id: fly-deploy.yml

      - name: Resolve affected projects
        id: affected
        if: env.COMPONENT == 'auto'
        run: |
          PROJECTS=$(npx nx show projects --affected --base="${NX_BASE}" --head="${NX_HEAD}" --sep=" " 2>/dev/null || true)
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"

      - name: Set deploy flags
        id: flags
        env:
          PROJECTS: ${{ steps.affected.outputs.projects }}
        run: |
          backend_affected=false
          frontend_affected=false
          if [ "$COMPONENT" = "auto" ]; then
            [[ " $PROJECTS " == *" marrow-backend "* ]] && backend_affected=true
            [[ " $PROJECTS " == *" marrow-frontend "* ]] && frontend_affected=true
          elif [ "$COMPONENT" = "all" ]; then
            backend_affected=true
            frontend_affected=true
          elif [ "$COMPONENT" = "api" ]; then
            backend_affected=true
          elif [ "$COMPONENT" = "mcp" ]; then
            echo "deploy_api=false" >> "$GITHUB_OUTPUT"
            echo "deploy_mcp=true" >> "$GITHUB_OUTPUT"
            echo "deploy_frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$COMPONENT" = "frontend" ]; then
            frontend_affected=true
          fi

          deploy_api=false
          deploy_mcp=false
          if [ "$backend_affected" = true ]; then
            if [ "$COMPONENT" = "api" ]; then
              deploy_api=true
            else
              deploy_api=true
              deploy_mcp=true
            fi
          fi

          echo "deploy_api=$deploy_api" >> "$GITHUB_OUTPUT"
          echo "deploy_mcp=$deploy_mcp" >> "$GITHUB_OUTPUT"
          echo "deploy_frontend=$frontend_affected" >> "$GITHUB_OUTPUT"

      - name: Set health URLs
        id: urls
        run: |
          if [ "$ENVIRONMENT" = "main" ]; then
            echo "api_health_url=https://api.marrow-health.com/api/v1/health" >> "$GITHUB_OUTPUT"
            echo "frontend_health_url=https://marrow-health.com/" >> "$GITHUB_OUTPUT"
            echo "mcp_health_url=https://marrow-mcp.fly.dev/mcp" >> "$GITHUB_OUTPUT"
          else
            echo "api_health_url=https://api-dev.marrow-health.com/api/v1/health" >> "$GITHUB_OUTPUT"
            echo "frontend_health_url=https://app-dev.marrow-health.com/" >> "$GITHUB_OUTPUT"
            echo "mcp_health_url=https://marrow-mcp-dev.fly.dev/mcp" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: deploy api
    needs: [resolve, plan]
    if: needs.resolve.outputs.should_run == 'true' && needs.plan.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-api-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ needs.resolve.outputs.environment == 'main' && 'fly.prod.toml' || 'fly.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy API (alembic via release_command)
        working-directory: apps/marrow/backend
        run: flyctl deploy --remote-only --config "$FLY_CONFIG"

  deploy-mcp:
    name: deploy mcp
    needs: [resolve, plan, deploy-api]
    if: >-
      needs.resolve.outputs.should_run == 'true' &&
      needs.plan.outputs.deploy_mcp == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fly-mcp-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ needs.resolve.outputs.environment == 'main' && 'fly.mcp.prod.toml' || 'fly.mcp.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy MCP
        working-directory: apps/marrow/backend
        run: flyctl deploy --remote-only --config "$FLY_CONFIG"

  deploy-frontend:
    name: deploy frontend
    needs: [resolve, plan, deploy-api]
    if: >-
      needs.resolve.outputs.should_run == 'true' &&
      needs.plan.outputs.deploy_frontend == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fly-ui-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ needs.resolve.outputs.environment == 'main' && 'fly.prod.toml' || 'fly.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy frontend
        working-directory: apps/marrow/frontend
        run: flyctl deploy --remote-only --config "$FLY_CONFIG"

  smoke:
    name: smoke
    needs: [resolve, plan, deploy-api, deploy-mcp, deploy-frontend]
    if: >-
      needs.resolve.outputs.should_run == 'true' &&
      always() &&
      (
        needs.deploy-api.result == 'success' ||
        needs.deploy-mcp.result == 'success' ||
        needs.deploy-frontend.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke API health
        if: needs.deploy-api.result == 'success'
        run: |
          for i in $(seq 1 12); do
            if curl -sf "${{ needs.plan.outputs.api_health_url }}"; then
              exit 0
            fi
            sleep 10
          done
          echo "API health check failed: ${{ needs.plan.outputs.api_health_url }}"
          exit 1

      - name: Smoke frontend
        if: needs.deploy-frontend.result == 'success'
        run: |
          for i in $(seq 1 12); do
            if curl -sf "${{ needs.plan.outputs.frontend_health_url }}" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Frontend health check failed: ${{ needs.plan.outputs.frontend_health_url }}"
          exit 1

      - name: Smoke MCP
        if: needs.deploy-mcp.result == 'success'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.plan.outputs.mcp_health_url }}")
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "MCP health check failed: ${{ needs.plan.outputs.mcp_health_url }}"
          exit 1
