name: Fly scale down (manual)

# One-off / on-demand scale tuning. Uses FLY_API_TOKEN from repo secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    name: scale api + frontends
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Prod API → 2 machines (1 web + 1 worker)
        run: flyctl scale count web=1 worker=1 -a health-tracker-api-prod -y

      - name: Prod frontend → 1 machine
        run: flyctl scale count 1 -a health-tracker-web-prod -y

      - name: Dev frontend → 1 machine
        run: flyctl scale count 1 -a health-tracker-web-dev -y

      - name: Show resulting scale
        run: |
          for app in health-tracker-api-prod health-tracker-web-prod health-tracker-web-dev; do
            echo "=== $app ==="
            flyctl scale show -a "$app"
            flyctl machines list -a "$app"
            echo
          done
