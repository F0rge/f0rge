name: Fly Deploy (reusable)

# Executor for deploy-reusable.yml — flags and health URLs are always preplanned there.

on:
  workflow_call:
    inputs:
      environment:
        description: develop or main
        required: true
        type: string
      sha:
        description: Commit SHA to deploy
        required: true
        type: string
      deploy_api:
        required: false
        type: boolean
        default: false
      deploy_mcp:
        required: false
        type: boolean
        default: false
      deploy_frontend:
        required: false
        type: boolean
        default: false
      api_health_url:
        required: false
        type: string
        default: ""
      frontend_health_url:
        required: false
        type: string
        default: ""
      mcp_health_url:
        required: false
        type: string
        default: ""
    secrets:
      FLY_API_TOKEN:
        required: true
      SMOKE_EMAIL:
        required: false
      SMOKE_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_api: ${{ steps.out.outputs.deploy_api }}
      deploy_mcp: ${{ steps.out.outputs.deploy_mcp }}
      deploy_frontend: ${{ steps.out.outputs.deploy_frontend }}
      api_health_url: ${{ steps.out.outputs.api_health_url }}
      frontend_health_url: ${{ steps.out.outputs.frontend_health_url }}
      mcp_health_url: ${{ steps.out.outputs.mcp_health_url }}
    steps:
      # ponytail: pure input passthrough — the job exists only so the deploy jobs
      # keep a common `needs` anchor for their skip-propagation `if`s.
      - name: Publish resolve outputs
        id: out
        run: |
          echo "deploy_api=${{ inputs.deploy_api && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "deploy_mcp=${{ inputs.deploy_mcp && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "deploy_frontend=${{ inputs.deploy_frontend && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "api_health_url=${{ inputs.api_health_url }}" >> "$GITHUB_OUTPUT"
          echo "frontend_health_url=${{ inputs.frontend_health_url }}" >> "$GITHUB_OUTPUT"
          echo "mcp_health_url=${{ inputs.mcp_health_url }}" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: deploy api
    needs: resolve
    if: needs.resolve.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-api-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ inputs.environment == 'main' && 'fly.prod.toml' || 'fly.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy API (alembic via release_command)
        run: flyctl deploy . --remote-only --config "apps/marrow/backend/$FLY_CONFIG"

  deploy-mcp:
    name: deploy mcp
    needs: [resolve, deploy-api]
    # !cancelled() is load-bearing: without a status function, a skipped deploy-api
    # skips this job outright and the `result == 'skipped'` clause never gets a say.
    if: >-
      !cancelled() &&
      needs.resolve.outputs.deploy_mcp == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fly-mcp-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ inputs.environment == 'main' && 'fly.mcp.prod.toml' || 'fly.mcp.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy MCP
        run: flyctl deploy . --remote-only --config "apps/marrow/backend/$FLY_CONFIG"

  deploy-frontend:
    name: deploy frontend
    needs: [resolve, deploy-api]
    # Frontend-only pushes skip deploy-api — without !cancelled() this job was
    # skipped too, so a UI-only change never reached Fly.
    if: >-
      !cancelled() &&
      needs.resolve.outputs.deploy_frontend == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fly-ui-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ inputs.environment == 'main' && 'fly.prod.toml' || 'fly.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy frontend
        run: flyctl deploy . --remote-only --config "apps/marrow/frontend/$FLY_CONFIG"

  smoke:
    name: smoke
    needs: [resolve, deploy-api, deploy-mcp, deploy-frontend]
    if: >-
      always() &&
      (
        needs.deploy-api.result == 'success' ||
        needs.deploy-mcp.result == 'success' ||
        needs.deploy-frontend.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke API health
        if: needs.deploy-api.result == 'success'
        run: |
          URL="${{ needs.resolve.outputs.api_health_url }}"
          for i in $(seq 1 12); do
            if curl -sf "$URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "API health check failed: $URL"
          exit 1

      - name: Smoke authenticated entries (skip if SMOKE_* unset)
        if: needs.deploy-api.result == 'success'
        env:
          API_BASE: ${{ needs.resolve.outputs.api_health_url }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "${SMOKE_EMAIL:-}" ] || [ -z "${SMOKE_PASSWORD:-}" ]; then
            echo "SMOKE_EMAIL/SMOKE_PASSWORD not configured — skipping auth smoke"
            exit 0
          fi
          API_ROOT="${API_BASE%/health}"
          COOKIE_JAR=$(mktemp)
          LOGIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}" \
            "$API_ROOT/auth/login")
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "Login smoke failed with HTTP $LOGIN_CODE"
            exit 1
          fi
          TODAY=$(date -u +%F)
          ENTRY_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -b "$COOKIE_JAR" \
            "$API_ROOT/entries/$TODAY")
          if [ "$ENTRY_CODE" != "200" ] && [ "$ENTRY_CODE" != "404" ]; then
            echo "GET /entries/$TODAY failed with HTTP $ENTRY_CODE"
            exit 1
          fi
          echo "Auth smoke OK (entries/$TODAY → $ENTRY_CODE)"
          rm -f "$COOKIE_JAR"

      - name: Smoke frontend
        if: needs.deploy-frontend.result == 'success'
        run: |
          URL="${{ needs.resolve.outputs.frontend_health_url }}"
          for i in $(seq 1 12); do
            if curl -sf "$URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Frontend health check failed: $URL"
          exit 1

      - name: Smoke MCP
        if: needs.deploy-mcp.result == 'success'
        run: |
          URL="${{ needs.resolve.outputs.mcp_health_url }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "MCP health check failed: $URL"
          exit 1
