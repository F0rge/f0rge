name: Fly Deploy (reusable)

# Called by deploy-reusable.yml (preplanned) or directly for backward compatibility.

on:
  workflow_call:
    inputs:
      environment:
        description: develop or main
        required: true
        type: string
      sha:
        description: Commit SHA to deploy
        required: true
        type: string
      base_branch:
        description: Branch used for nx-set-shas base (legacy plan mode)
        required: false
        type: string
        default: develop
      workflow_id:
        description: Caller workflow filename for nx-set-shas (legacy plan mode)
        required: false
        type: string
        default: ci-develop.yml
      component:
        description: auto or all/api/mcp/frontend (legacy plan mode)
        required: false
        type: string
        default: auto
      preplanned:
        description: When true, use deploy_* and health URL inputs from orchestrator
        required: false
        type: boolean
        default: false
      deploy_api:
        required: false
        type: boolean
        default: false
      deploy_mcp:
        required: false
        type: boolean
        default: false
      deploy_frontend:
        required: false
        type: boolean
        default: false
      api_health_url:
        required: false
        type: string
        default: ""
      frontend_health_url:
        required: false
        type: string
        default: ""
      mcp_health_url:
        required: false
        type: string
        default: ""
    secrets:
      FLY_API_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_api: ${{ steps.out.outputs.deploy_api }}
      deploy_mcp: ${{ steps.out.outputs.deploy_mcp }}
      deploy_frontend: ${{ steps.out.outputs.deploy_frontend }}
      api_health_url: ${{ steps.out.outputs.api_health_url }}
      frontend_health_url: ${{ steps.out.outputs.frontend_health_url }}
      mcp_health_url: ${{ steps.out.outputs.mcp_health_url }}
    steps:
      - name: Use preplanned flags
        if: inputs.preplanned == true
        id: preplanned
        run: |
          echo "deploy_api=${{ inputs.deploy_api && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "deploy_mcp=${{ inputs.deploy_mcp && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "deploy_frontend=${{ inputs.deploy_frontend && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "api_health_url=${{ inputs.api_health_url }}" >> "$GITHUB_OUTPUT"
          echo "frontend_health_url=${{ inputs.frontend_health_url }}" >> "$GITHUB_OUTPUT"
          echo "mcp_health_url=${{ inputs.mcp_health_url }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: inputs.preplanned != true
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v4
        if: inputs.preplanned != true
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root deps
        if: inputs.preplanned != true
        run: npm ci

      - uses: nrwl/nx-set-shas@v4
        if: inputs.preplanned != true && inputs.component == 'auto'
        with:
          main-branch-name: ${{ inputs.base_branch }}
          workflow-id: ${{ inputs.workflow_id }}

      - name: Resolve affected projects
        id: affected
        if: inputs.preplanned != true && inputs.component == 'auto'
        run: |
          set -o pipefail
          PROJECTS=$(npx nx show projects --affected --base="${NX_BASE}" --head="${NX_HEAD}" --json | jq -r 'join(" ")')
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"

      - name: Legacy deploy flags
        id: legacy
        if: inputs.preplanned != true
        env:
          COMPONENT: ${{ inputs.component }}
          PROJECTS: ${{ steps.affected.outputs.projects }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          backend_affected=false
          frontend_affected=false
          if [ "$COMPONENT" = "auto" ]; then
            [[ " $PROJECTS " == *" marrow-backend "* ]] && backend_affected=true
            [[ " $PROJECTS " == *" marrow-frontend "* ]] && frontend_affected=true
          elif [ "$COMPONENT" = "all" ]; then
            backend_affected=true
            frontend_affected=true
          elif [ "$COMPONENT" = "api" ]; then
            backend_affected=true
          elif [ "$COMPONENT" = "mcp" ]; then
            echo "deploy_api=false" >> "$GITHUB_OUTPUT"
            echo "deploy_mcp=true" >> "$GITHUB_OUTPUT"
            echo "deploy_frontend=false" >> "$GITHUB_OUTPUT"
            if [ "$ENVIRONMENT" = "main" ]; then
              echo "api_health_url=https://api.marrow-health.com/api/v1/health" >> "$GITHUB_OUTPUT"
              echo "frontend_health_url=https://marrow-health.com/" >> "$GITHUB_OUTPUT"
              echo "mcp_health_url=https://marrow-mcp.fly.dev/mcp" >> "$GITHUB_OUTPUT"
            else
              echo "api_health_url=https://api-dev.marrow-health.com/api/v1/health" >> "$GITHUB_OUTPUT"
              echo "frontend_health_url=https://app-dev.marrow-health.com/" >> "$GITHUB_OUTPUT"
              echo "mcp_health_url=https://marrow-mcp-dev.fly.dev/mcp" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          elif [ "$COMPONENT" = "frontend" ]; then
            frontend_affected=true
          fi

          deploy_api=false
          deploy_mcp=false
          if [ "$backend_affected" = true ]; then
            if [ "$COMPONENT" = "api" ]; then
              deploy_api=true
            else
              deploy_api=true
              deploy_mcp=true
            fi
          fi

          echo "deploy_api=$deploy_api" >> "$GITHUB_OUTPUT"
          echo "deploy_mcp=$deploy_mcp" >> "$GITHUB_OUTPUT"
          echo "deploy_frontend=$frontend_affected" >> "$GITHUB_OUTPUT"
          if [ "$ENVIRONMENT" = "main" ]; then
            echo "api_health_url=https://api.marrow-health.com/api/v1/health" >> "$GITHUB_OUTPUT"
            echo "frontend_health_url=https://marrow-health.com/" >> "$GITHUB_OUTPUT"
            echo "mcp_health_url=https://marrow-mcp.fly.dev/mcp" >> "$GITHUB_OUTPUT"
          else
            echo "api_health_url=https://api-dev.marrow-health.com/api/v1/health" >> "$GITHUB_OUTPUT"
            echo "frontend_health_url=https://app-dev.marrow-health.com/" >> "$GITHUB_OUTPUT"
            echo "mcp_health_url=https://marrow-mcp-dev.fly.dev/mcp" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish resolve outputs
        id: out
        run: |
          if [ "${{ inputs.preplanned }}" = "true" ]; then
            echo "deploy_api=${{ steps.preplanned.outputs.deploy_api }}" >> "$GITHUB_OUTPUT"
            echo "deploy_mcp=${{ steps.preplanned.outputs.deploy_mcp }}" >> "$GITHUB_OUTPUT"
            echo "deploy_frontend=${{ steps.preplanned.outputs.deploy_frontend }}" >> "$GITHUB_OUTPUT"
            echo "api_health_url=${{ steps.preplanned.outputs.api_health_url }}" >> "$GITHUB_OUTPUT"
            echo "frontend_health_url=${{ steps.preplanned.outputs.frontend_health_url }}" >> "$GITHUB_OUTPUT"
            echo "mcp_health_url=${{ steps.preplanned.outputs.mcp_health_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_api=${{ steps.legacy.outputs.deploy_api }}" >> "$GITHUB_OUTPUT"
            echo "deploy_mcp=${{ steps.legacy.outputs.deploy_mcp }}" >> "$GITHUB_OUTPUT"
            echo "deploy_frontend=${{ steps.legacy.outputs.deploy_frontend }}" >> "$GITHUB_OUTPUT"
            echo "api_health_url=${{ steps.legacy.outputs.api_health_url }}" >> "$GITHUB_OUTPUT"
            echo "frontend_health_url=${{ steps.legacy.outputs.frontend_health_url }}" >> "$GITHUB_OUTPUT"
            echo "mcp_health_url=${{ steps.legacy.outputs.mcp_health_url }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: deploy api
    needs: resolve
    if: needs.resolve.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-api-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ inputs.environment == 'main' && 'fly.prod.toml' || 'fly.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy API (alembic via release_command)
        run: flyctl deploy . --remote-only --config "apps/marrow/backend/$FLY_CONFIG"

  deploy-mcp:
    name: deploy mcp
    needs: [resolve, deploy-api]
    if: >-
      needs.resolve.outputs.deploy_mcp == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fly-mcp-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ inputs.environment == 'main' && 'fly.mcp.prod.toml' || 'fly.mcp.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy MCP
        run: flyctl deploy . --remote-only --config "apps/marrow/backend/$FLY_CONFIG"

  deploy-frontend:
    name: deploy frontend
    needs: resolve
    if: needs.resolve.outputs.deploy_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fly-ui-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_CONFIG: ${{ inputs.environment == 'main' && 'fly.prod.toml' || 'fly.toml' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy frontend
        run: flyctl deploy . --remote-only --config "apps/marrow/frontend/$FLY_CONFIG"

  smoke:
    name: smoke
    needs: [resolve, deploy-api, deploy-mcp, deploy-frontend]
    if: >-
      always() &&
      (
        needs.deploy-api.result == 'success' ||
        needs.deploy-mcp.result == 'success' ||
        needs.deploy-frontend.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke API health
        if: needs.deploy-api.result == 'success'
        run: |
          URL="${{ needs.resolve.outputs.api_health_url }}"
          for i in $(seq 1 12); do
            if curl -sf "$URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "API health check failed: $URL"
          exit 1

      - name: Smoke frontend
        if: needs.deploy-frontend.result == 'success'
        run: |
          URL="${{ needs.resolve.outputs.frontend_health_url }}"
          for i in $(seq 1 12); do
            if curl -sf "$URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Frontend health check failed: $URL"
          exit 1

      - name: Smoke MCP
        if: needs.deploy-mcp.result == 'success'
        run: |
          URL="${{ needs.resolve.outputs.mcp_health_url }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "MCP health check failed: $URL"
          exit 1
