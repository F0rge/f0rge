version: 1

# Maps Nx projects to deploy targets. The orchestrator (deploy-reusable.yml)
# filters by branch/environment and nx affected before calling executors.
# Marrow: Railway GitHub autodeploy + Actions smoke only. dk: Coolify on main.

components:
  marrow-backend:
    nx: marrow-backend
    target: railway
    branches: [develop, main]
    railway:
      role: api
      health_url:
        develop: https://api-dev.marrow-health.com/api/v1/health
        main: https://api.marrow-health.com/api/v1/health
    also_deploys:
      - role: mcp
        health_url:
          develop: https://mcp-dev.marrow-health.com/mcp
          main: https://mcp.marrow-health.com/mcp

  marrow-frontend:
    nx: marrow-frontend
    target: railway
    branches: [develop, main]
    railway:
      role: frontend
      health_url:
        develop: https://app-dev.marrow-health.com/
        main: https://marrow-health.com/

  dk-tag-printer-backend:
    nx: dk-tag-printer-backend
    target: coolify
    branches: [main]
    coolify:
      app_uuid: pskswsc8c0044ggo40go4og0
      webhook_secret_env: COOLIFY_WEBHOOK_DK_BACKEND
    health_url: https://tags-api.leo-figueiredo.com/health

  dk-tag-printer-frontend:
    nx: dk-tag-printer-frontend
    target: coolify
    branches: [main]
    coolify:
      app_uuid: f080ossg88ows8k8csw40c4s
      webhook_secret_env: COOLIFY_WEBHOOK_DK_FRONTEND
    health_url: https://tags.leo-figueiredo.com/

  # Vellano: own Railway project (not zoological-fulfillment / not Marrow develop).
  # Develop only. Custom hosts on leo-figueiredo.com (one-level SSL).
  vellano-backend:
    nx: vellano-backend
    target: railway
    branches: [develop]
    railway:
      role: api
      health_url:
        develop: https://vellano-dev-api.leo-figueiredo.com/api/v1/health

  vellano-frontend:
    nx: vellano-frontend
    target: railway
    branches: [develop]
    railway:
      role: frontend
      health_url:
        develop: https://vellano-dev.leo-figueiredo.com/
