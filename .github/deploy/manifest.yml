version: 1

# Maps Nx projects to deploy targets. The orchestrator (deploy-reusable.yml)
# filters by branch/environment and nx affected before calling executors.
# Marrow: Railway GitHub autodeploy + Actions smoke only. dk + buycycle: Coolify (Pi) on main.

components:
  marrow-backend:
    nx: marrow-backend
    target: railway
    branches: [main]
    railway:
      role: api
      health_url:
        main: https://api.marrow-health.com/api/v1/health
    also_deploys:
      - role: mcp
        health_url:
          main: https://mcp.marrow-health.com/mcp

  marrow-frontend:
    nx: marrow-frontend
    target: railway
    branches: [main]
    railway:
      role: frontend
      health_url:
        main: https://marrow-health.com/

  dk-tag-printer-backend:
    nx: dk-tag-printer-backend
    target: coolify
    branches: [main]
    coolify:
      app_uuid: pskswsc8c0044ggo40go4og0
      webhook_secret_env: COOLIFY_WEBHOOK_DK_BACKEND
    health_url: https://tags-api.leo-figueiredo.com/health

  dk-tag-printer-frontend:
    nx: dk-tag-printer-frontend
    target: coolify
    branches: [main]
    coolify:
      app_uuid: f080ossg88ows8k8csw40c4s
      webhook_secret_env: COOLIFY_WEBHOOK_DK_FRONTEND
    health_url: https://tags.leo-figueiredo.com/

  # Buycycle dashboards: Coolify on the Pi, internal only (host ports 8095/8096, no domain).
  # No health_url: GitHub runners cannot reach the Pi, so the deploy trusts Coolify's "queued" response.
  buycycle:
    nx: buycycle
    target: coolify
    host: pi
    branches: [main]
    coolify:
      app_uuid: xi0qwpbyl2d8gf8u3xl13jkv
      webhook_secret_env: COOLIFY_WEBHOOK_BUYCYCLE

  # Buycycle MCP: Coolify on the Pi, Tailscale only. Container port 8097, published on
  # 100.103.61.77:8097. No public hostname, no Cloudflare tunnel, no health_url.
  # Placeholder app_uuid skips the webhook until the Coolify app exists. Deploys are CI-only.
  buycycle-mcp:
    nx: buycycle-mcp
    target: coolify
    host: pi
    branches: [main]
    port: 8097
    coolify:
      app_uuid: TODO-buycycle-mcp
      webhook_secret_env: COOLIFY_WEBHOOK_BUYCYCLE_MCP

  # Firstout: own Railway project (not zoological-fulfillment).
  # main only (Railway env is named develop but tracks main). Public hosts are firstout.co.za and api.firstout.co.za.
  firstout-backend:
    nx: firstout-backend
    target: railway
    branches: [main]
    railway:
      role: api
      health_url:
        main: https://api.firstout.co.za/api/v1/health

  firstout-frontend:
    nx: firstout-frontend
    target: railway
    branches: [main]
    railway:
      role: frontend
      health_url:
        main: https://firstout.co.za/
