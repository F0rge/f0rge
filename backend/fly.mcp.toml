# health-tracker MCP server (dev)
# Deploy from repo root: fly deploy --config backend/fly.mcp.toml

app = "health-tracker-mcp-dev"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  MCP_SERVER_HOST = "0.0.0.0"
  MCP_SERVER_PORT = "8005"
  DIETARY_DATA_DIR = "/app/data-seed"
  FLY_MPG_SKIP_ROLE_DDL = "1"

[processes]
  mcp = "/app/.venv/bin/python -m app.mcp --transport streamable-http --host 0.0.0.0 --port 8005"

[http_service]
  internal_port = 8005
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["mcp"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
  processes = ["mcp"]
