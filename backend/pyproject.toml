[project]
name = "health-tracker-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "bcrypt>=4.0",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "cryptography>=42.0",
    "greenlet>=3.3.2",
    "pgvector>=0.3",
    "mcp>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
