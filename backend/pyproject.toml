[project]
name = "health-tracker-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "bcrypt>=4.0",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
