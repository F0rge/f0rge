# health-tracker API + embedding worker (dev)
# Deploy: fly deploy --config fly.toml
# Migrations run once via release_command — do NOT set RUN_MIGRATIONS on Fly.

app = "health-tracker-api-dev"
primary_region = "cdg"

[build]
  context = "backend"
  dockerfile = "Dockerfile"

[deploy]
  release_command = "uv run alembic upgrade head"

[env]
  PHOTO_DIR = "/app/photos"
  DIETARY_DATA_DIR = "/app/data-seed"
  MCP_SERVER_HOST = "0.0.0.0"
  MCP_SERVER_PORT = "8005"

[processes]
  web = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "uv run python -m app.embedding_pipeline"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "2s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["web"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["worker"]
