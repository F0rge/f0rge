# Config-as-code for firstout-api in the *Firstout* Railway project
# (not Marrow zoological-fulfillment). Tracks git `main` only.
# Point that service's Config File path here. Do NOT set Root Directory.
# CoS provisions the Firstout project + services separately; this file is repo config only.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/firstout/backend/Dockerfile"
watchPatterns = [
  "apps/firstout/**",
  "libs/backend/core/**",
  "libs/backend/db/**",
  "libs/backend/storage/**",
]

[deploy]
startCommand = "uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"
# Controlled release step, not a replica-start hook. The runner locks PostgreSQL,
# checks reviewed migration hashes, and records a commit-bound completion receipt.
preDeployCommand = "uv run --no-sync python -m app.commands.release_migrate"
healthcheckPath = "/api/v1/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
