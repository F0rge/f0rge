[project]
name = "dk-tag-printer-backend"
version = "2.0.0"
description = "DasKasas price tag generator API"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.109",
    "pandas>=2.2",
    "fpdf>=1.7",
    "python-multipart>=0.0.6",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
