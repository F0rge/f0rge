[project]
name = "dk-tag-printer-backend"
version = "2.0.0"
description = "DasKasas price tag generator API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.109",
    "pandas>=2.2",
    "fpdf>=1.7",
    "python-multipart>=0.0.6",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.uv]
constraint-dependencies = [
    "dnspython>=2.9.2",  # GHSA-45c3-73f7-pv4m / CVE-2026-114605; GHSA-vvf4-9x63-8xvv / CVE-2026-128089 (email-validator transitive)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
