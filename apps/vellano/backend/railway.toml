# Config-as-code for vellano-api (point Railway service Config File path here).
# Shared monorepo: do NOT set Root Directory — build context is the repo root.
# CoS provisions the Railway service separately; this file is repo config only.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/vellano/backend/Dockerfile"
watchPatterns = [
  "apps/vellano/**",
  "libs/backend/core/**",
  "libs/backend/db/**",
]

[deploy]
startCommand = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
preDeployCommand = "/bin/sh -c 'DATABASE_URL=\"${MIGRATION_DATABASE_URL:-$DATABASE_URL}\" uv run alembic upgrade head'"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
