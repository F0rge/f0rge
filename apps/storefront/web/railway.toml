# Config-as-code for the isolated Storefront private-preview web service.
# Set Railway Root Directory to the repository root and use this file as the
# service config path. Never attach this service to the Firstout or Marrow project.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/storefront/web/Dockerfile"
watchPatterns = [
  "apps/storefront/web/**",
  "libs/ui/**",
  "package.json",
  "package-lock.json",
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
