# Marrow Next.js frontend (prod)
# Deploy from repo root: fly deploy . --config apps/marrow/frontend/fly.prod.toml
# The `.` arg sets the build context to the repo root, but dockerfile/ignorefile
# resolve relative to THIS config file's directory (apps/marrow/frontend/), so
# they stay bare filenames while the .dockerignore uses repo-root-relative paths.

app = "marrow-ui"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"
  [build.args]
    API_URL = "https://api.marrow-health.com"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
