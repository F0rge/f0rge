# Marrow API + embedding worker (prod)
# Deploy from repo root: fly deploy . --config apps/marrow/backend/fly.prod.toml
# The `.` arg sets the build context to the repo root, but dockerfile/ignorefile
# resolve relative to THIS config file's directory (apps/marrow/backend/), so
# they stay bare filenames while the .dockerignore uses repo-root-relative paths.

app = "marrow"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[deploy]
  # Migrations run as an owner-capable role (htmigrate = schema_admin), NOT the
  # least-privilege runtime role healthtracker-app which can't ALTER schema_admin's
  # tables (fails 023's SET NOT NULL with "must be owner"). Runtime web/worker keep
  # using DATABASE_URL (healthtracker-app) so RLS stays enforced. Falls back to
  # DATABASE_URL if the migration secret is unset. See .cursor/rules/infra.mdc.
  release_command = "sh -c 'DATABASE_URL=\"${MIGRATION_DATABASE_URL:-$DATABASE_URL}\" uv run alembic upgrade head'"

[env]
  PHOTO_DIR = "/app/photos"
  DIETARY_DATA_DIR = "/app/data-seed"
  MCP_SERVER_HOST = "0.0.0.0"
  MCP_SERVER_PORT = "8005"
  FLY_MPG_SKIP_ROLE_DDL = "1"

[processes]
  web = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "uv run python -m app.embedding_pipeline"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "2s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["web"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["worker"]
