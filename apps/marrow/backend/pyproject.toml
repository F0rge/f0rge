[project]
name = "health-tracker-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "cryptography>=42.0",
    "greenlet>=3.3.2",
    "pgvector>=0.3",
    "mcp>=1.10",
    "boto3>=1.35",
    "sentry-sdk[fastapi]>=2.0",
    "f0rge-core",
    "f0rge-db",
    "f0rge-storage",
    "aioapns>=4.0",
    "redis>=5.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.7",
    "f0rge-testing",
]

[tool.uv.sources]
f0rge-core = { path = "../../../libs/backend/core", editable = true }
f0rge-db = { path = "../../../libs/backend/db", editable = true }
f0rge-storage = { path = "../../../libs/backend/storage", editable = true }
f0rge-testing = { path = "../../../libs/backend/testing", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Keep the gate narrow to what's already clean on `main`: pyflakes (F)
# minus F821 (false-positive on SQLAlchemy string-relationship forward refs)
# plus pycodestyle errors/warnings (E, W).
# Import sorting (I) and broader rule packs (UP/B/SIM/RUF) are a follow-up
# — adding them all at once would block this dev-env CI bootstrap on a
# code-cleanup PR. Run `ruff check --select I --fix` to land that step.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long — formatter handles this
    "F821",  # undefined name — false-positive on Mapped["Name"] forward refs
]
