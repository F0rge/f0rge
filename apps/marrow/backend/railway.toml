# Config-as-code for marrow-api (point Railway service Config File path here).
# Shared monorepo: do NOT set Root Directory — build context is the repo root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/marrow/backend/Dockerfile"
watchPatterns = [
  "apps/marrow/backend/**",
  "libs/backend/**",
]

[deploy]
startCommand = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
preDeployCommand = "/bin/sh -c 'DATABASE_URL=\"${MIGRATION_DATABASE_URL:-$DATABASE_URL}\" uv run alembic upgrade head'"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
