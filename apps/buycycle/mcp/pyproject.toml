[project]
name = "buycycle-mcp"
version = "1.0.0"
description = "Read-only MCP server for the Buycycle deal tracker (Tailscale only)"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=9.0", "pyturso==0.8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../tracker"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
