[package]
name = "buycycle-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
f0rge-identity = { path = "../../../libs/rust/identity" }
actix-web = { version = "4.19.0", default-features = false, features = ["macros"] }
actix-files = "0.6"
f0rge-api-errors = { path = "../../../libs/rust/api-errors", features = ["openapi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6", features = ["actix_extras", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
diesel = { version = "2.3", default-features = false, features = ["postgres", "serde_json", "chrono", "uuid"] }
diesel-async = { version = "0.10", features = ["postgres", "bb8"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
sha2 = "0.10"
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
actix-rt = "2"
