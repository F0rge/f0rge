# health-tracker Next.js frontend (dev)
# Deploy: fly deploy --config fly.toml (from frontend/)

app = "health-tracker-web-dev"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    API_URL = "https://health-tracker-api-dev.fly.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
