services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: health-tracker-postgres
    environment:
      - POSTGRES_USER=health
      - POSTGRES_DB=health
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=20
    volumes:
      - health-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - health-tracker-network

  postgres-backup:
    image: postgres:16-alpine
    container_name: health-tracker-postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGUSER=health
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=health
      - BACKUP_DIR=/backups
      - KEEP_DAYS=14
      - KEEP_COUNT=14
    volumes:
      - /mnt/nvme/home/leo/vaults/brain/Health-Backups/:/backups/
    # NOTE: the backup logic is INLINED here on purpose.
    # We previously bind-mounted ./backend/scripts/pg_backup.sh, but Coolify's
    # dockercompose build-pack does not materialise repo files unless they are
    # compose bind-mount sources at build time, and we hit a state where the
    # file was missing and the container crash-looped. Inlining removes the
    # file dependency entirely — the script lives in the compose, so as long
    # as the compose deploys, the backup logic deploys with it.
    # The trigger lives on the Pi host at /home/leo/run-health-pg-backup.sh
    # (daily cron) which `docker exec`s into this container and runs
    # /usr/local/bin/pg_backup.sh. The long sleep is just a keepalive.
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        # NOTE: every shell variable reference below MUST be written as $$VAR
        # or $${VAR} so Docker Compose does NOT interpolate it before the shell
        # sees the heredoc. PR #59 shipped without this escaping and produced
        # a script with all $$vars empty-stringed (mkdir "", pg_dump -f "", ...).
        # Hotfix: PR #60.
        cat > /usr/local/bin/pg_backup.sh <<'PGBACKUP'
        #!/bin/sh
        # Daily Postgres backup for health-tracker (inlined from docker-compose).
        # Writes a custom-format dump (-Fc, internally compressed) to $$BACKUP_DIR
        # and prunes by count + age. Expects PGHOST/PGUSER/PGPASSWORD/PGDATABASE
        # plus BACKUP_DIR/KEEP_DAYS/KEEP_COUNT in the environment.
        set -eu
        set -o pipefail 2>/dev/null || true
        backup_dir="$${BACKUP_DIR:-/backups}"
        keep_days="$${KEEP_DAYS:-14}"
        keep_count="$${KEEP_COUNT:-14}"
        ts="$$(date -u +%Y%m%dT%H%M%SZ)"
        dump_file="$${backup_dir}/health-$${ts}.dump"
        log() { printf "[%s] %s\n" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$*"; }
        mkdir -p "$$backup_dir"
        log "starting pg_dump (host=$$PGHOST db=$$PGDATABASE -> $$dump_file)"
        if ! pg_dump -Fc --no-owner --no-privileges -f "$$dump_file"; then
            log "pg_dump FAILED (exit $$?), removing partial file"
            rm -f "$$dump_file"
            exit 1
        fi
        size=$$(stat -c %s "$$dump_file" 2>/dev/null || echo "?")
        log "pg_dump OK, size=$${size} bytes"
        log "pruning: keep newest $$keep_count, drop older than $${keep_days}d"
        ls -1t "$$backup_dir"/health-*.dump 2>/dev/null | tail -n +$$((keep_count + 1)) | xargs -r rm -v
        find "$$backup_dir" -maxdepth 1 -name "health-*.dump" -mtime "+$${keep_days}" -print -delete
        log "done"
        PGBACKUP
        chmod +x /usr/local/bin/pg_backup.sh
        # Run once at startup, then idle. Daily trigger is the host cron job.
        /usr/local/bin/pg_backup.sh || true
        exec sleep infinity
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - health-tracker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-backend
    user: "1000:1000"
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - VAULT_PATH=/vault
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - CORS_ORIGINS=["https://health.leo-figueiredo.com","http://localhost:3004"]
      - PHOTO_DIR=/app/photos
    volumes:
      - health-photos:/app/photos
      - health-lab-attachments:/app/lab_attachments
      - /mnt/nvme/home/leo/vaults/brain:/vault:rw
    restart: unless-stopped
    networks:
      - health-tracker-network

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-mcp
    user: "1000:1000"
    command: ["uv", "run", "python", "-m", "app.mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8005"]
    # Host port 8005 is occupied on the Pi (entre-nos backend); host:8007 -> container:8005.
    # Cloudflare tunnel ingress for health-mcp.leo-figueiredo.com must target localhost:8007.
    ports:
      - "8007:8005"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - MCP_READONLY_DATABASE_URL=postgresql+asyncpg://healthtracker_ro:${HEALTHTRACKER_RO_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8005
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - health-tracker-network

  embedding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-embedding-worker
    user: "1000:1000"
    command: ["uv", "run", "python", "-m", "app.embedding_pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - EMBEDDING_WORKER_POLL_INTERVAL_SECONDS=5
      - EMBEDDING_WORKER_BATCH_SIZE=10
      - EMBEDDING_WORKER_MAX_ATTEMPTS=5
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - health-tracker-network

  # Frontend is managed by a separate Coolify app (uuid o0kw8wwscooc00o4gkcosocs),
  # not by this compose stack. It owns port 3004 and deploys from ./frontend/Dockerfile.

volumes:
  health-postgres-data:
  health-photos:
  health-lab-attachments:

networks:
  health-tracker-network:
    driver: bridge
