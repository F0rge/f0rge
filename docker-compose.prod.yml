services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: health-tracker-postgres
    environment:
      - POSTGRES_USER=health
      - POSTGRES_DB=health
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=20
    volumes:
      - health-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - health-tracker-network

  postgres-backup:
    image: postgres:16-alpine
    container_name: health-tracker-postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGUSER=health
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=health
    volumes:
      - /mnt/nvme/home/leo/vaults/brain/Health-Backups/:/backups/
      - ./backend/scripts/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
    command: ["sh", "-c", "while true; do /usr/local/bin/pg_backup.sh; sleep 604800; done"]
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - health-tracker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-backend
    user: "1000:1000"
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - VAULT_PATH=/vault
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - CORS_ORIGINS=["https://health.leo-figueiredo.com","http://localhost:3004"]
      - PHOTO_DIR=/app/photos
    volumes:
      - health-photos:/app/photos
      - health-lab-attachments:/app/lab_attachments
      - /mnt/nvme/home/leo/vaults/brain:/vault:rw
    restart: unless-stopped
    networks:
      - health-tracker-network

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-mcp
    user: "1000:1000"
    command: ["uv", "run", "python", "-m", "app.mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8005"]
    # Host port 8005 is occupied on the Pi (entre-nos backend); host:8007 -> container:8005.
    # Cloudflare tunnel ingress for health-mcp.leo-figueiredo.com must target localhost:8007.
    ports:
      - "8007:8005"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - MCP_READONLY_DATABASE_URL=postgresql+asyncpg://healthtracker_ro:${HEALTHTRACKER_RO_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8005
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - health-tracker-network

  embedding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-embedding-worker
    user: "1000:1000"
    command: ["uv", "run", "python", "-m", "app.embedding_pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://health:${POSTGRES_PASSWORD}@postgres:5432/health
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - EMBEDDING_WORKER_POLL_INTERVAL_SECONDS=5
      - EMBEDDING_WORKER_BATCH_SIZE=10
      - EMBEDDING_WORKER_MAX_ATTEMPTS=5
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - health-tracker-network

  # Frontend is managed by a separate Coolify app (uuid o0kw8wwscooc00o4gkcosocs),
  # not by this compose stack. It owns port 3004 and deploys from ./frontend/Dockerfile.

volumes:
  health-postgres-data:
  health-photos:
  health-lab-attachments:

networks:
  health-tracker-network:
    driver: bridge
