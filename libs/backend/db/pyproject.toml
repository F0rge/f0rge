[project]
name = "f0rge-db"
version = "0.1.0"
description = "Shared async SQLAlchemy engine/session factories, tenant RLS machinery, and CRUD base"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "f0rge-core",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
f0rge-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f0rge_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Cloned from apps/marrow/backend plus TID: shared libs must never import app code.
select = ["E", "F", "W", "TID"]
ignore = [
    "E501",  # line too long — formatter handles this
    "F821",  # undefined name — false-positive on Mapped["Name"] forward refs
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app".msg = "shared libs must not import app code"
